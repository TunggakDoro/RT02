<!doctype html>
<html lang="id">
<meta charset="UTF-8">
<meta content="light dark" name="color-scheme">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<title>Random Name</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, :before, :after { box-sizing: border-box; margin: 0; padding: 0 }
:root {
  --bg: #f5f0e0;
  --bg-card: #ffffff;
  --bg-elevated: #ede5cc;
  --border: #d6c9a8;
  --border-hover: #8a7a4f;
  --text: #0a2e22;
  --text-muted: #2d4a3e;
  --text-dim: #6b7a6f;
  --accent: #0d7a5f;
  --accent-hover: #064e3b;
  --gold: #c9a84c;
  --gold-hover: #b08f35;
  --success: #0d7a5f;
  --error: #b91c1c;
  --warning: #b08f35;
  --info: #0e7490;
  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 10px;
  --shadow: 0 1px 2px #06402d14, 0 2px 8px #06402d1a, 0 0 0 1px #c9a84c0d;
  --shadow-lg: 0 18px 40px -12px #06402d33, 0 6px 16px -6px #06402d1f, 0 0 0 1px #c9a84c1f;
  --gradient-accent: linear-gradient(135deg, #0d7a5f 0%, #064e3b 100%);
  --gradient-gold: linear-gradient(135deg, #c9a84c 0%, #b08f35 100%);
  --ring: 0 0 0 3px #c9a84c4d
}
body.night {
  --bg: #051512;
  --bg-card: #0a2018;
  --bg-elevated: #0f2a20;
  --border: #1f3a30;
  --border-hover: #c9a84c80;
  --text: #f5f0e0;
  --text-muted: #d4cdb8;
  --text-dim: #94a89a;
  --accent: #c9a84c;
  --accent-hover: #e0c071;
  --gold: #e0c071;
  --gold-hover: #f0d78c;
  --success: #4ade80;
  --error: #f87171;
  --warning: #fbbf24;
  --info: #5eead4;
  --shadow: 0 1px 2px #00000080, 0 2px 8px #00000066, 0 0 0 1px #c9a84c14;
  --shadow-lg: 0 24px 50px -12px #000000b3, 0 10px 22px -6px #00000080, 0 0 0 1px #c9a84c1f;
  --gradient-accent: linear-gradient(135deg, #c9a84c 0%, #b08f35 100%);
  --gradient-gold: linear-gradient(135deg, #e0c071 0%, #c9a84c 100%);
  --ring: 0 0 0 3px #c9a84c4d
}
body {
  font-family: var(--font);
  background:
    radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--accent) 8%, transparent), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, color-mix(in oklab, var(--gold) 10%, transparent), transparent 60%),
    var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding: 24px 16px;
  line-height: 1.5
}
::selection { background: var(--gold); color: #0a2e22 }
::-webkit-scrollbar { width: 8px; height: 8px }
::-webkit-scrollbar-track { background: var(--bg-elevated) }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent), color-mix(in oklab, var(--accent) 60%, #000)); border-radius: 8px; border: 2px solid var(--bg-elevated) }
::-webkit-scrollbar-thumb:hover { background: var(--gold) }

.container {
  background: var(--bg-card);
  border: 1px solid var(--border);
  max-width: 560px;
  box-shadow: var(--shadow-lg);
  border-radius: 12px;
  margin: 0 auto;
  overflow: hidden
}

.header {
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  padding: 14px 16px
}
.header-row { justify-content: space-between; align-items: center; gap: 8px; display: flex }
.header-left { align-items: center; gap: 10px; display: flex }
.header h1 { letter-spacing: .1em; text-transform: uppercase; color: var(--text); font-size: 11px; font-weight: 700 }
.version { color: var(--text); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 9px }
.header-actions { gap: 6px; display: flex }
.icon-btn {
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
  width: 32px; height: 32px; color: var(--text-muted); cursor: pointer;
  justify-content: center; align-items: center; transition: all .2s; display: flex; position: relative
}
.icon-btn:hover { background: var(--text); color: var(--bg-card); border-color: var(--text) }
.theme-icon-moon { display: none }
body.night .theme-icon-sun { display: none }
body.night .theme-icon-moon { display: block }
.header p { color: var(--text-muted); margin-top: 4px; font-size: 10px }

.generator { border-bottom: 1px solid var(--border); padding: 16px }
.section-label { text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-size: 9px; font-weight: 600; margin-bottom: 10px }
.btn-inline { text-transform: uppercase; letter-spacing: .04em; background: var(--bg-elevated); height: 44px; color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 600; font-family: var(--font); white-space: nowrap; justify-content: center; align-items: center; gap: 6px; padding: 0 16px; transition: all .2s; display: flex }
.btn-inline:hover { background: var(--text); border-color: var(--text); color: var(--bg-card) }
.btn-inline:disabled { opacity: .5; cursor: not-allowed; pointer-events: none }
.btn-inline.primary { background: var(--gradient-accent) !important; color: #f5f0e0 !important; border: 1px solid transparent !important; box-shadow: 0 2px 0 0 color-mix(in oklab, var(--accent) 50%, #000), var(--shadow) }
.btn-inline.primary:hover { filter: brightness(1.08); box-shadow: var(--ring), var(--shadow-lg); transform: translateY(-1px) }
.btn-inline.loading { pointer-events: none; opacity: .7 }
.btn-inline.loading .btn-icon { display: none }
.btn-inline.loading .btn-spinner { display: block }
.btn-spinner { animation: 1s linear infinite spin; display: none }

.toggles { flex-wrap: wrap; gap: 16px; margin-top: 14px; display: flex }
.toggle-label { cursor: pointer; align-items: center; gap: 8px; display: flex }
.toggle-switch { background: var(--border); border-radius: 10px; width: 36px; height: 20px; transition: background .2s; position: relative }
.toggle-switch.active { background: var(--accent) }
.toggle-switch:after { content: ""; background: #fff; border-radius: 50%; width: 16px; height: 16px; transition: transform .2s; position: absolute; top: 2px; left: 2px }
.toggle-switch.active:after { transform: translateX(16px) }
.toggle-text { color: var(--text-muted); font-size: 10px; user-select: none }

.float-input-row { display: flex; align-items: center; gap: 8px }
.float-input { position: relative; margin-bottom: 10px }
.float-input input, .float-input select { width: 100%; height: 44px; padding: 14px 10px 4px; font-family: var(--font); font-size: 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; transition: border-color .2s }
.float-input input:focus, .float-input select:focus { border-color: var(--accent) }
.float-label { position: absolute; top: 6px; left: 10px; font-size: 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); pointer-events: none }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em }
.badge-count { background: var(--gradient-accent); color: #f5f0e0; border: 1px solid transparent; font-weight: 700 }

.empty-state { text-align: center; padding: 24px 16px; color: var(--text-dim); font-size: 10px }
.empty-state svg { margin-bottom: 8px; opacity: .4 }

.name-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px }
@media (max-width: 560px) { .name-cards { grid-template-columns: 1fr } }
.name-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow) }
.name-card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--bg-elevated); border-bottom: 1px solid var(--border) }
.name-card-header-left { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 8px }
.name-card-header-left svg { color: var(--accent); flex-shrink: 0 }
.name-card-body { flex: 1; min-height: 190px; display: flex; align-items: center; justify-content: center; padding: 12px }
.name-card-list { display: none; width: 100%; border: none; border-radius: 0; max-height: 220px; position: relative; overflow-y: auto }
.name-card-list.visible { display: block }
.name-card-list .bulk-item { height: 33px; box-sizing: border-box }
.name-card-footer { border-top: 1px solid var(--border); padding: 10px }

.bulk-item { border-bottom: 1px solid var(--border); display: flex; align-items: stretch }
.bulk-item:last-child { border-bottom: none }
.bulk-item-num { background: var(--bg-elevated); color: var(--text-dim); font-size: 9px; font-weight: 600; min-width: 28px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); flex-shrink: 0 }
.bulk-item-body { flex: 1; padding: 8px 10px; min-width: 0 }
.bulk-item-short { font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bulk-item-copy { background: none; border: none; border-left: 1px solid var(--border); width: 36px; flex-shrink: 0; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s }
.bulk-item-copy:hover { background: var(--accent); color: #fff }
.btn-delete-all { color: var(--error); border-color: var(--error) }
.btn-delete-all:hover { background: var(--error); border-color: var(--error); color: #fff }

.toast-container { display: flex; flex-direction: column; gap: 8px; pointer-events: none; position: fixed; bottom: 20px; right: 20px }
.toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); align-items: center; gap: 8px; max-width: 320px; padding: 12px 16px; font-size: 11px; animation: .3s slideIn; display: flex }
.toast.success { border-left: 3px solid var(--success) }
.toast.error { border-left: 3px solid var(--error) }
.toast.info { border-left: 3px solid var(--info) }
.toast.warning { border-left: 3px solid var(--warning) }

.icon { flex-shrink: 0; width: 14px; height: 14px }
.icon-sm { width: 12px; height: 12px }
.icon-xs { width: 10px; height: 10px }

@keyframes slideIn { 0% { opacity: 0; transform: translate(100%) } to { opacity: 1; transform: translate(0) } }
@keyframes spin { to { transform: rotate(360deg) } }
</style>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- MAIN CONTAINER -->
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="header-left">
        <svg id="logoIconName" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <svg id="logoIconOtp" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="2" style="display:none">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L14.5 10"/>
        </svg>
        <h1 id="appTitle">Random Name</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="nameBtn" title="Buka Random Name" onclick="setMode('name')">
          <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          </svg>
        </button>
        <button class="icon-btn" id="twofaBtn" title="Buka Autentikasi 2FA" onclick="setMode('2fa')">
          <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L14.5 10"/>
          </svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" class="icon-xs theme-icon-sun" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg viewBox="0 0 24 24" class="icon-xs theme-icon-moon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- VIEW: RANDOM NAME -->
  <div id="viewRandomName">

  <!-- GENERATOR FORM -->
  <div class="generator">
    <div class="float-input-row" style="margin-bottom:10px">
      <div class="float-input" style="flex:1;margin:0">
        <span class="float-label">Jumlah</span>
        <input id="nameCount" type="number" min="1" max="50000" value="1" inputmode="numeric">
      </div>
      <div class="float-input" style="flex:1;margin:0">
        <span class="float-label">Format Username</span>
        <select id="nameFormat">
          <option value="user_underscore_num">nama_nama1234</option>
          <option value="user_dot_num">nama.nama1234</option>
          <option value="user_plain">namanama</option>
          <option value="user_underscore_middle">nama_tengah_nama</option>
          <option value="user_dot_middle">nama.tengah.nama</option>
        </select>
      </div>
    </div>

    <div class="toggles" style="margin-top:4px;margin-bottom:4px">
      <label class="toggle-label">
        <div class="toggle-switch active" id="toggleNameMiddle" onclick="this.classList.toggle('active')"></div>
        <span class="toggle-text">Full Name pakai nama tengah</span>
      </label>
    </div>

    <div class="toggles" style="margin-top:4px;margin-bottom:4px">
      <label class="toggle-label">
        <div class="toggle-switch active" id="toggleNameLower" onclick="this.classList.toggle('active')"></div>
        <span class="toggle-text">Lowercase (khusus username)</span>
      </label>
    </div>

    <div class="toggles" style="margin-top:4px;margin-bottom:12px">
      <label class="toggle-label">
        <div class="toggle-switch" id="toggleNameUnique" onclick="this.classList.toggle('active')"></div>
        <span class="toggle-text">Pastikan tidak ada duplikat dalam batch</span>
      </label>
    </div>

    <button class="btn-inline primary" id="btnGenerateNames" onclick="generateNames()" style="width:100%;margin-top:4px">
      <svg class="icon-xs btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <svg class="icon-xs btn-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10" stroke-dasharray="31.4" stroke-dashoffset="10"/>
      </svg>
      Generate
    </button>
  </div>

  <!-- OUTPUT: dua kartu berdampingan -->
  <div class="name-cards">
    <div class="name-card">
      <div class="name-card-header">
        <span class="name-card-header-left">
          <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          Full Names
        </span>
        <span class="badge badge-count" id="fullNameBadge">0 item</span>
      </div>
      <div class="name-card-body">
        <div class="empty-state" id="fullNameEmpty" style="padding:0">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 8px">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          <div>Klik <strong>Generate</strong><br>untuk membuat nama</div>
        </div>
        <div class="bulk-list name-card-list" id="fullNameList"></div>
      </div>
      <div class="name-card-footer" style="display:flex;gap:8px">
        <button class="btn-inline" onclick="copyAllFullNames()" style="flex:1">
          <svg viewBox="0 0 24 24" class="icon-xs btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Salin
        </button>
        <button class="btn-inline btn-delete-all" onclick="deleteAllFullNames()" style="flex:1">
          <svg viewBox="0 0 24 24" class="icon-xs btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
          Hapus Semua
        </button>
      </div>
    </div>

    <div class="name-card">
      <div class="name-card-header">
        <span class="name-card-header-left">
          <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          Username
        </span>
        <span class="badge badge-count" id="usernameBadge">0 item</span>
      </div>
      <div class="name-card-body">
        <div class="empty-state" id="usernameEmpty" style="padding:0">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 8px">
            <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
          </svg>
          <div>Username muncul<br>setelah <strong>Generate</strong></div>
        </div>
        <div class="bulk-list name-card-list" id="usernameList"></div>
      </div>
      <div class="name-card-footer" style="display:flex;gap:8px">
        <button class="btn-inline" onclick="copyAllUsernames()" style="flex:1">
          <svg viewBox="0 0 24 24" class="icon-xs btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Salin
        </button>
        <button class="btn-inline btn-delete-all" onclick="deleteAllUsernames()" style="flex:1">
          <svg viewBox="0 0 24 24" class="icon-xs btn-icon" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
          Hapus Semua
        </button>
      </div>
    </div>
  </div>

  </div>
  <!-- /VIEW: RANDOM NAME -->

  <!-- VIEW: AUTENTIKASI 2FA -->
  <div id="view2FA" style="display:none">

    <!-- INPUT SECRET KEYS -->
    <div class="name-cards" style="grid-template-columns:1fr">
      <div class="name-card">
        <div class="name-card-header">
          <span class="name-card-header-left">
            <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 12l1.8 1.8L14.5 10"/>
            </svg>
            Input Secret Keys
          </span>
          <span style="color:var(--text-dim);font-size:9px;text-transform:uppercase;letter-spacing:.04em" id="otpKeyBadge">0 key</span>
        </div>
        <div class="name-card-body" style="padding:12px">
          <textarea id="otpSecrets" rows="6" placeholder="Masukkan secret OTP satu per baris..." oninput="onOtpSecretsInput()" style="width:100%;min-height:120px;padding:12px;font-family:var(--font);font-size:11px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);outline:none;resize:vertical;transition:border-color .2s"></textarea>
        </div>
      </div>
    </div>

    <!-- HASIL KODE OTP -->
    <div class="name-cards" style="grid-template-columns:1fr">
      <div class="name-card">
        <div class="name-card-header">
          <span class="name-card-header-left">
            <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>

// ══════════════════════════════════════════════
// STATE (khusus tema, tidak ada koneksi worker)
// ══════════════════════════════════════════════
const STORAGE_KEY = 'namegen_v1_theme';
let state = { theme: 'light', mode: 'name' };

function init() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
  } catch(e) {}
  applyTheme();
  applyMode();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function toggleTheme() {
  state.theme = state.theme === 'night' ? 'light' : 'night';
  applyTheme(); saveState();
}
function applyTheme() {
  document.body.classList.toggle('night', state.theme === 'night');
}

// ══════════════════════════════════════════════
// MODE SWITCH (Random Name  ⇄  Autentikasi 2FA)
// ══════════════════════════════════════════════
function setMode(m) {
  if (state.mode === m) return;
  state.mode = m;
  applyMode(); saveState();
}
function toggleMode() { setMode(state.mode === 'name' ? '2fa' : 'name'); }
function applyMode() {
  const isTwoFA = state.mode === '2fa';

  document.getElementById('viewRandomName').style.display = isTwoFA ? 'none' : '';
  document.getElementById('view2FA').style.display = isTwoFA ? '' : 'none';
  document.getElementById('appTitle').textContent = isTwoFA ? 'Autentikasi 2FA' : 'Random Name';
  document.title = isTwoFA ? 'Autentikasi 2FA' : 'Random Name';

  document.getElementById('logoIconName').style.display = isTwoFA ? 'none' : 'block';
  document.getElementById('logoIconOtp').style.display = isTwoFA ? 'block' : 'none';

  const nameBtn = document.getElementById('nameBtn');
  const twofaBtn = document.getElementById('twofaBtn');
  if (nameBtn && twofaBtn) {
    nameBtn.style.opacity = isTwoFA ? '0.45' : '1';
    twofaBtn.style.opacity = isTwoFA ? '1' : '0.45';
    nameBtn.style.color = isTwoFA ? '' : 'var(--accent)';
    twofaBtn.style.color = isTwoFA ? 'var(--accent)' : '';
  }

  if (isTwoFA) computeAndRenderOtp();
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
// Wrapper copy-to-clipboard dengan fallback. navigator.clipboard bisa
// undefined di beberapa browser saat file dibuka langsung lewat file://
// (bukan http/https), jadi kita sediakan fallback pakai execCommand supaya
// tombol Copy tetap berfungsi di kondisi itu.
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand copy gagal'));
    } catch (err) {
      reject(err);
    }
  });
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.addEventListener('DOMContentLoaded', init);

// ── Penambahan skala besar: perluas pool nama secara otomatis ──
// Selain daftar manual di atas, generator sekarang membuat ribuan variasi
// first name dan last name yang masih bernuansa nama Amerika. Tujuannya agar
// generate berulang tidak terasa mentok di nama yang itu-itu saja.
function addUniqueNames(target, names) {
  const existing = new Set(target.map(function(n){ return String(n).toLowerCase(); }));
  for (let i = 0; i < names.length; i++) {
    const clean = String(names[i] || '').replace(/[^A-Za-z]/g, '');
    if (clean.length < 3 || clean.length > 14) continue;
    const name = clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
    const key = name.toLowerCase();
    if (!existing.has(key)) { existing.add(key); target.push(name); }
  }
}

function randomUnit() {
  try {
    if (window.crypto && window.crypto.getRandomValues) {
      const n = new Uint32Array(1);
      window.crypto.getRandomValues(n);
      return n[0] / 4294967296;
    }
  } catch(e) {}
  return Math.random();
}

function randomIndex(pool) { return Math.floor(randomUnit() * pool.length); }
function randomInt(min, max) { return Math.floor(min + randomUnit() * (max - min + 1)); }

// ── Anti-repetition: hindari pengulangan nama yang baru saja dipakai ──
// Catatan performa: sebelumnya "recent" berupa array dan dicek pakai
// recent.includes() di dalam pool.filter() untuk SETIAP nama yang mau
// dibuat. Itu membuat kompleksitasnya kuadratik (pool.length x recent.length
// per panggilan) sehingga generate 10.000+ nama membuat browser freeze total.
// Sekarang "recent" pakai Set (lookup O(1)) dan pemilihan pakai rejection
// sampling (pilih acak, cek cepat, ulangi jika perlu) — jauh lebih ringan
// untuk jumlah besar, dengan hasil acak yang setara secara statistik.
const RECENT_FIRST = new Set();
const RECENT_LAST = new Set();
const RECENT_MIDDLE = new Set();

function pickFresh(pool, recent, exclude) {
  // "exclude" boleh berupa satu nilai atau array nilai (mis. saat memilih
  // middle name, kita mau exclude first DAN last sekaligus).
  const excludeList = exclude == null ? [] : (Array.isArray(exclude) ? exclude : [exclude]);
  const maxRecent = Math.max(5, Math.floor(pool.length * 0.65));

  // Fallback pengaman: kalau recent + exclude sudah menutupi (hampir) seluruh
  // pool, reset recent supaya tidak stuck mencari kandidat yang valid.
  if (recent.size >= pool.length - excludeList.length) recent.clear();

  let pick;
  let tries = 0;
  const maxTries = pool.length * 4; // batas aman, jauh lebih besar dari rata-rata kebutuhan
  do {
    pick = pool[randomIndex(pool)];
    tries++;
    if (tries > maxTries) { recent.clear(); break; } // safety valve, hindari infinite loop
  } while (recent.has(pick) || excludeList.includes(pick));

  recent.add(pick);
  if (recent.size > maxRecent) {
    // Set di JS mempertahankan urutan insert, jadi elemen pertama = yang paling lama
    recent.delete(recent.values().next().value);
  }
  return pick;
}

function buildIdentity() {
  const first = pickFresh(FIRST_NAMES_USA_FEMALE, RECENT_FIRST);
  const last = pickFresh(LAST_NAMES_USA, RECENT_LAST, first); // last != first
  const middle = pickFresh(FIRST_NAMES_USA_FEMALE, RECENT_MIDDLE, [first, last]); // middle != first, middle != last
  return { first, last, middle };
}

function formatFullName(identity, includeMiddle) {
  return includeMiddle
    ? `${identity.first} ${identity.middle} ${identity.last}`
    : `${identity.first} ${identity.last}`;
}

function formatUsername(identity, format, lowercase) {
  let f = identity.first, m = identity.middle, l = identity.last;
  if (lowercase) { f = f.toLowerCase(); m = m.toLowerCase(); l = l.toLowerCase(); }
  const randNum = () => randomInt(1000, 9999); // angka acak 4 digit

  switch (format) {
    case 'user_underscore_num': return `${f}_${l}${randNum()}`;
    case 'user_dot_num': return `${f}.${l}${randNum()}`;
    case 'user_plain': return `${f}${l}`;
    case 'user_underscore_middle': return `${f}_${m}_${l}`;
    case 'user_dot_middle': return `${f}.${m}.${l}`;
    default: return `${f}_${l}${randNum()}`;
  }
}

const NAME_ROW_HEIGHT = 33;
const NAME_ROW_BUFFER = 12;

function setupVirtualNameList(container, items, rowRenderer) {
  container.innerHTML = '<div class="v-phantom" style="position:relative"><div class="v-rows" style="position:absolute;top:0;left:0;right:0"></div></div>';
  const phantom = container.querySelector('.v-phantom');
  const rows = container.querySelector('.v-rows');
  phantom.style.height = (items.length * NAME_ROW_HEIGHT) + 'px';

  function paint() {
    const scrollTop = container.scrollTop;
    const viewH = container.clientHeight || 220;
    let start = Math.floor(scrollTop / NAME_ROW_HEIGHT) - NAME_ROW_BUFFER;
    let end = Math.ceil((scrollTop + viewH) / NAME_ROW_HEIGHT) + NAME_ROW_BUFFER;
    start = Math.max(0, start);
    end = Math.min(items.length, end);
    rows.style.top = (start * NAME_ROW_HEIGHT) + 'px';
    let html = '';
    for (let i = start; i < end; i++) html += rowRenderer(items[i], i);
    rows.innerHTML = html;
  }

  container.onscroll = function(){ paint(); if(container._syncing){return;} var otherId = container.id==='fullNameList' ? 'usernameList' : (container.id==='usernameList' ? 'fullNameList' : null); if(!otherId) return; var other = document.getElementById(otherId); if(!other) return; other._syncing = true; other.scrollTop = container.scrollTop; requestAnimationFrame(function(){ other._syncing = false; }); };
  paint();
}

function generateNames() {
  const countInput = document.getElementById('nameCount');
  let count = parseInt(countInput.value, 10);
  if (!count || count < 1) count = 1;
  if (count > 50000) { count = 50000; countInput.value = 50000; showToast('Maksimal 50.000 per batch', 'warning'); }

  const usernameFormat = document.getElementById('nameFormat').value;
  const includeMiddleInFullName = document.getElementById('toggleNameMiddle').classList.contains('active');
  const lowercase = document.getElementById('toggleNameLower').classList.contains('active');
  const ensureUnique = document.getElementById('toggleNameUnique').classList.contains('active');

  const btn = document.getElementById('btnGenerateNames');
  btn.classList.add('loading');

  // Generate secara chunked (async) supaya UI tidak freeze untuk jumlah besar
  const fullNames = [];
  const usernames = [];
  const seen = new Set();
  const maxAttempts = count * 50; // batas aman supaya tidak infinite loop kalau unik diminta lebih dari kombinasi yang ada
  let attempts = 0;
  const CHUNK = 2000;

  function step() {
    const chunkEnd = Math.min(attempts + CHUNK, maxAttempts);
    while (attempts < chunkEnd && fullNames.length < count) {
      const identity = buildIdentity();
      attempts++;
      const fullName = formatFullName(identity, includeMiddleInFullName);
      const username = formatUsername(identity, usernameFormat, lowercase);
      // Kunci duplikat HARUS mengikuti output yang benar-benar ditampilkan
      // (Full Name + Username), bukan field mentah identitas. Kalau hanya
      // field identitas yang dicek, dua identitas bisa dianggap "unik"
      // (mis. middle beda) padahal format username yang dipakai tidak
      // menampilkan middle sama sekali → username-nya jadi kembar walau
      // toggle "tidak ada duplikat" aktif.
      const key = `${fullName}|${username}`;
      if (ensureUnique) {
        if (seen.has(key)) continue;
        seen.add(key);
      }
      fullNames.push(fullName);
      usernames.push(username);
    }

    if (fullNames.length < count && attempts < maxAttempts) {
      // lanjut chunk berikutnya di frame berikutnya, biar browser sempat "bernapas"
      setTimeout(step, 0);
      return;
    }

    btn.classList.remove('loading');

    if (ensureUnique && fullNames.length < count) {
      showToast(`Hanya bisa generate ${fullNames.length} identitas unik (kombinasi tersedia terbatas)`, 'warning');
    }

    renderNameCards(fullNames, usernames);
    showToast(`${fullNames.length} nama & username berhasil dibuat!`, 'success');
  }

  step();
}

// ══════════════════════════════════════════════
// GENERATE KODE OTP (TOTP asli, RFC 6238) DARI SECRET KEY
// Implementasi SHA1/HMAC murni JS (tanpa crypto.subtle) supaya tetap
// jalan walau file dibuka langsung lewat file:// di browser yang
// membatasi Web Crypto API ke secure context.
// ══════════════════════════════════════════════
const OTP_PERIOD = 30;
const OTP_DIGITS = 6;
let otpLastCounter = null;
let otpTimerStarted = false;

function sha1(bytesIn) {
  function rotl(n, s) { return ((n << s) | (n >>> (32 - s))) >>> 0; }
  const bytes = Array.from(bytesIn);
  const ml = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  bytes.push(0, 0, 0, 0);
  bytes.push((ml >>> 24) & 0xff, (ml >>> 16) & 0xff, (ml >>> 8) & 0xff, ml & 0xff);

  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;

  for (let chunkStart = 0; chunkStart < bytes.length; chunkStart += 64) {
    const w = new Array(80);
    for (let i = 0; i < 16; i++) {
      w[i] = ((bytes[chunkStart + i * 4] << 24) | (bytes[chunkStart + i * 4 + 1] << 16) |
              (bytes[chunkStart + i * 4 + 2] << 8) | (bytes[chunkStart + i * 4 + 3])) >>> 0;
    }
    for (let i = 16; i < 80; i++) w[i] = rotl(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);

    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const temp = (rotl(a, 5) + f + e + k + w[i]) >>> 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = temp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }

  const out = new Uint8Array(20);
  [h0, h1, h2, h3, h4].forEach((h, idx) => {
    out[idx * 4] = (h >>> 24) & 0xff;
    out[idx * 4 + 1] = (h >>> 16) & 0xff;
    out[idx * 4 + 2] = (h >>> 8) & 0xff;
    out[idx * 4 + 3] = h & 0xff;
  });
  return out;
}

function hmacSha1(keyBytes, msgBytes) {
  const blockSize = 64;
  let key = Array.from(keyBytes);
  if (key.length > blockSize) key = Array.from(sha1(new Uint8Array(key)));
  while (key.length < blockSize) key.push(0);
  const ipad = key.map(b => b ^ 0x36);
  const opad = key.map(b => b ^ 0x5c);
  const innerHash = sha1(new Uint8Array([...ipad, ...msgBytes]));
  return sha1(new Uint8Array([...opad, ...innerHash]));
}

// Secret OTP yang valid HANYA boleh berisi huruf A-Z dan angka 2-7
// (alfabet Base32 RFC4648), dengan panjang minimal 16 karakter (setara
// 80-bit) — itu standar minimum yang dipakai Google/Meta/GitHub dkk.
// Kalau tidak memenuhi ini, dianggap BUKAN secret key asli.
function isValidBase32Secret(secret) {
  const clean = secret.replace(/=+$/, '');
  if (clean.length < 16) return false;
  return /^[A-Z2-7]+$/i.test(clean);
}

function base32Decode(input) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = String(input).toUpperCase().replace(/=+$/, '');
  let bits = '';
  for (const c of clean) {
    const val = alphabet.indexOf(c);
    if (val === -1) continue;
    bits += val.toString(2).padStart(5, '0');
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.substr(i, 8), 2));
  return new Uint8Array(bytes);
}

function totpCode(secretBytes, period, digits, timeSec) {
  const counter = Math.floor(timeSec / period);
  const msg = new Uint8Array(8);
  let c = counter;
  for (let i = 7; i >= 0; i--) { msg[i] = c & 0xff; c = Math.floor(c / 256); }
  const hmac = hmacSha1(secretBytes, msg);
  const offset = hmac[19] & 0xf;
  const binCode = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset + 1] & 0xff) << 16) |
                  ((hmac[offset + 2] & 0xff) << 8) | (hmac[offset + 3] & 0xff);
  const mod = Math.pow(10, digits);
  return (binCode % mod).toString().padStart(digits, '0');
}

function parseOtpSecrets(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .map((line, idx) => {
      let label = 'Key ' + (idx + 1);
      let secretRaw = line;
      const colonIdx = line.indexOf(':');
      if (colonIdx > -1) {
        const maybeLabel = line.slice(0, colonIdx).trim();
        if (maybeLabel) label = maybeLabel;
        secretRaw = line.slice(colonIdx + 1).trim();
      }
      return { label, secret: secretRaw.replace(/\s+/g, '') };
    });
}

function onOtpSecretsInput() {
  computeAndRenderOtp();
}

function computeAndRenderOtp() {
  const text = document.getElementById('otpSecrets').value;
  const entries = parseOtpSecrets(text);
  const keyBadge = document.getElementById('otpKeyBadge');
  const empty = document.getElementById('otpEmpty');
  const list = document.getElementById('otpList');
  const resultBadge = document.getElementById('otpResultBadge');

  keyBadge.textContent = entries.length + ' key';

  if (!entries.length) {
    empty.style.display = '';
    list.style.display = 'none';
    list.innerHTML = '';
    resultBadge.textContent = '0 kode';
    window._otpCodes = [];
    ensureOtpTimer();
    return;
  }

  const nowSec = Math.floor(Date.now() / 1000);
  const remaining = OTP_PERIOD - (nowSec % OTP_PERIOD);

  const codes = entries.map(entry => {
    try {
      if (!isValidBase32Secret(entry.secret)) throw new Error('bukan format secret Base32 yang valid');
      const secretBytes = base32Decode(entry.secret);
      if (secretBytes.length < 10) throw new Error('secret terlalu pendek');
      const code = totpCode(secretBytes, OTP_PERIOD, OTP_DIGITS, nowSec);
      return { label: entry.label, code, error: false };
    } catch (e) {
      return { label: entry.label, code: null, error: true };
    }
  });

  window._otpCodes = codes;
  resultBadge.textContent = codes.length + ' kode';
  empty.style.display = 'none';
  list.style.display = 'block';

  list.innerHTML = codes.map((c, i) => `
    <div class="bulk-item" id="otpList-item-${i}">
      <div class="bulk-item-num">${i + 1}</div>
      <div class="bulk-item-body">
        <div class="bulk-item-short" style="font-size:15px;letter-spacing:.1em;${c.error ? 'color:var(--error)' : ''}">${c.error ? 'Secret tidak valid' : c.code}</div>
        <div style="font-size:9px;color:var(--text-dim);margin-top:2px">${escHtml(c.label)}${c.error ? '' : ` · refresh <span id="otp-cd-${i}">${remaining}</span>s`}</div>
      </div>
      ${c.error ? '' : `
      <button class="bulk-item-copy" title="Copy" onclick="copySingleOtp(${i})">
        <svg viewBox="0 0 24 24" class="icon-xs" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>`}
    </div>
  `).join('');

  otpLastCounter = Math.floor(nowSec / OTP_PERIOD);
  ensureOtpTimer();
}

function ensureOtpTimer() {
  if (otpTimerStarted) return;
  otpTimerStarted = true;
  setInterval(() => {
    if (state.mode !== '2fa') return;
    const text = document.getElementById('otpSecrets').value;
    if (!text.trim()) return;

    const nowSec = Math.floor(Date.now() / 1000);
    const counter = Math.floor(nowSec / OTP_PERIOD);
    const remaining = OTP_PERIOD - (nowSec % OTP_PERIOD);

    if (counter !== otpLastCounter) {
      computeAndRenderOtp();
    } else {
      (window._otpCodes || []).forEach((c, i) => {
        const el = document.getElementById('otp-cd-' + i);
        if (el) el.textContent = remaining;
      });
    }
  }, 1000);
}

function resetOtp() {
  document.getElementById('otpSecrets').value = '';
  computeAndRenderOtp();
  showToast('Direset', 'info');
}

function copySingleOtp(i) {
  const entry = (window._otpCodes || [])[i];
  if (!entry || !entry.code) return;
  copyText(entry.code)
    .then(() => showToast('Kode disalin!', 'success'))
    .catch(() => showToast('Gagal menyalin', 'error'));
}

function copyAllOtp() {
  const codes = (window._otpCodes || []).filter(c => c.code).map(c => `${c.label}: ${c.code}`);
  if (!codes.length) { showToast('Belum ada kode untuk disalin', 'warning'); return; }
  copyText(codes.join('\n'))
    .then(() => showToast(`${codes.length} kode disalin!`, 'success'))
    .catch(() => showToast('Gagal menyalin', 'error'));
}
</script>
</html>
