// STATE (khusus tema, tidak ada koneksi worker)

const STORAGE_KEY = &#x27;namegen_v1_theme&#x27;;
let state = { theme: &#x27;light&#x27;, mode: &#x27;name&#x27; };

function init() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) state = { ...state, ...JSON.parse(saved) };
  } catch(e) {}
  applyTheme();
  applyMode();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function toggleTheme() {
  state.theme = state.theme === &#x27;night&#x27; ? &#x27;light&#x27; : &#x27;night&#x27;;
  applyTheme(); saveState();
}
function applyTheme() {
  document.body.classList.toggle(&#x27;night&#x27;, state.theme === &#x27;night&#x27;);
}

// ══════════════════════════════════════════════
// MODE SWITCH (Random Name  ⇄  Autentikasi 2FA)
// ══════════════════════════════════════════════
function setMode(m) {
  if (state.mode === m) return;
  state.mode = m;
  applyMode(); saveState();
}
function toggleMode() { setMode(state.mode === &#x27;name&#x27; ? &#x27;2fa&#x27; : &#x27;name&#x27;); }
window.addEventListener(&#x27;message&#x27;, function(e){
  var d = e.data || {};
  if (d &amp;&amp; d.type === &#x27;set-mode&#x27; &amp;&amp; (d.mode === &#x27;name&#x27; || d.mode === &#x27;2fa&#x27;)) setMode(d.mode);
});
function applyMode() {
  const isTwoFA = state.mode === &#x27;2fa&#x27;;

  document.getElementById(&#x27;viewRandomName&#x27;).style.display = isTwoFA ? &#x27;none&#x27; : &#x27;&#x27;;
  document.getElementById(&#x27;view2FA&#x27;).style.display = isTwoFA ? &#x27;&#x27; : &#x27;none&#x27;;
  document.getElementById(&#x27;appTitle&#x27;).textContent = isTwoFA ? &#x27;Autentikasi 2FA&#x27; : &#x27;Random Name&#x27;;
  document.title = isTwoFA ? &#x27;Autentikasi 2FA&#x27; : &#x27;Random Name&#x27;;
  try{parent.postMessage({type:&#x27;set-title&#x27;,title:document.title},&#x27;*&#x27;);}catch(e){}

  document.getElementById(&#x27;logoIconName&#x27;).style.display = isTwoFA ? &#x27;none&#x27; : &#x27;block&#x27;;
  document.getElementById(&#x27;logoIconOtp&#x27;).style.display = isTwoFA ? &#x27;block&#x27; : &#x27;none&#x27;;

  const nameBtn = document.getElementById(&#x27;nameBtn&#x27;);
  const twofaBtn = document.getElementById(&#x27;twofaBtn&#x27;);
  if (nameBtn &amp;&amp; twofaBtn) {
    nameBtn.style.opacity = isTwoFA ? &#x27;0.45&#x27; : &#x27;1&#x27;;
    twofaBtn.style.opacity = isTwoFA ? &#x27;1&#x27; : &#x27;0.45&#x27;;
    nameBtn.style.color = isTwoFA ? &#x27;&#x27; : &#x27;var(--accent)&#x27;;
    twofaBtn.style.color = isTwoFA ? &#x27;var(--accent)&#x27; : &#x27;&#x27;;
  }

  if (isTwoFA) computeAndRenderOtp();
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function showToast(msg, type = &#x27;info&#x27;) {
  const container = document.getElementById(&#x27;toastContainer&#x27;);
  const toast = document.createElement(&#x27;div&#x27;);
  toast.className = &#x27;toast &#x27; + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() =&gt; toast.remove(), 3500);
}
// Wrapper copy-to-clipboard dengan fallback. navigator.clipboard bisa
// undefined di beberapa browser saat file dibuka langsung lewat file://
// (bukan http/https), jadi kita sediakan fallback pakai execCommand supaya
// tombol Copy tetap berfungsi di kondisi itu.
function copyText(text) {
  if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) =&gt; {
    try {
      const ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text;
      ta.style.position = &#x27;fixed&#x27;;
      ta.style.opacity = &#x27;0&#x27;;
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand(&#x27;copy&#x27;);
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error(&#x27;execCommand copy gagal&#x27;));
    } catch (err) {
      reject(err);
    }
  });
}

function escHtml(s) {
  return String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
}

// ── Penambahan skala besar: perluas pool nama secara otomatis ──
// Selain daftar manual di atas, generator sekarang membuat ribuan variasi
// first name dan last name yang masih bernuansa nama Amerika. Tujuannya agar
// generate berulang tidak terasa mentok di nama yang itu-itu saja.
function addUniqueNames(target, names) {
  const existing = new Set(target.map(function(n){ return String(n).toLowerCase(); }));
  for (let i = 0; i &lt; names.length; i++) {
    const clean = String(names[i] || &#x27;&#x27;).replace(/[^A-Za-z]/g, &#x27;&#x27;);
    if (clean.length &lt; 3 || clean.length &gt; 14) continue;
    const name = clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
    const key = name.toLowerCase();
    if (!existing.has(key)) { existing.add(key); target.push(name); }
  }
}

function randomUnit() {
  try {
    if (window.crypto &amp;&amp; window.crypto.getRandomValues) {
      const n = new Uint32Array(1);
      window.crypto.getRandomValues(n);
      return n[0] / 4294967296;
    }
  } catch(e) {}
  return Math.random();
}

function randomIndex(pool) { return Math.floor(randomUnit() * pool.length); }
function randomInt(min, max) { return Math.floor(min + randomUnit() * (max - min + 1)); }

// ── Anti-repetition: hindari pengulangan nama yang baru saja dipakai ──
// Catatan performa: sebelumnya &quot;recent&quot; berupa array dan dicek pakai
// recent.includes() di dalam pool.filter() untuk SETIAP nama yang mau
// dibuat. Itu membuat kompleksitasnya kuadratik (pool.length x recent.length
// per panggilan) sehingga generate 10.000+ nama membuat browser freeze total.
// Sekarang &quot;recent&quot; pakai Set (lookup O(1)) dan pemilihan pakai rejection
// sampling (pilih acak, cek cepat, ulangi jika perlu) — jauh lebih ringan
// untuk jumlah besar, dengan hasil acak yang setara secara statistik.
const RECENT_FIRST = new Set();
const RECENT_LAST = new Set();
const RECENT_MIDDLE = new Set();

function pickFresh(pool, recent, exclude) {
  // &quot;exclude&quot; boleh berupa satu nilai atau array nilai (mis. saat memilih
  // middle name, kita mau exclude first DAN last sekaligus).
  const excludeList = exclude == null ? [] : (Array.isArray(exclude) ? exclude : [exclude]);
  const maxRecent = Math.max(5, Math.floor(pool.length * 0.65));

  // Fallback pengaman: kalau recent + exclude sudah menutupi (hampir) seluruh
  // pool, reset recent supaya tidak stuck mencari kandidat yang valid.
  if (recent.size &gt;= pool.length - excludeList.length) recent.clear();

  let pick;
  let tries = 0;
  const maxTries = pool.length * 4; // batas aman, jauh lebih besar dari rata-rata kebutuhan
  do {
    pick = pool[randomIndex(pool)];
    tries++;
    if (tries &gt; maxTries) { recent.clear(); break; } // safety valve, hindari infinite loop
  } while (recent.has(pick) || excludeList.includes(pick));

  recent.add(pick);
  if (recent.size &gt; maxRecent) {
    // Set di JS mempertahankan urutan insert, jadi elemen pertama = yang paling lama
    recent.delete(recent.values().next().value);
  }
  return pick;
}

function buildIdentity() {
  const first = pickFresh(FIRST_NAMES_USA_FEMALE, RECENT_FIRST);
  const last = pickFresh(LAST_NAMES_USA, RECENT_LAST, first); // last != first
  const middle = pickFresh(FIRST_NAMES_USA_FEMALE, RECENT_MIDDLE, [first, last]); // middle != first, middle != last
  return { first, last, middle };
}

function formatFullName(identity, includeMiddle) {
  return includeMiddle
    ? `${identity.first} ${identity.middle} ${identity.last}`
    : `${identity.first} ${identity.last}`;
}

function formatUsername(identity, format, lowercase) {
  let f = identity.first, m = identity.middle, l = identity.last;
  if (lowercase) { f = f.toLowerCase(); m = m.toLowerCase(); l = l.toLowerCase(); }
  const randNum = () =&gt; randomInt(1000, 9999); // angka acak 4 digit

  switch (format) {
    case &#x27;user_underscore_num&#x27;: return `${f}_${l}${randNum()}`;
    case &#x27;user_dot_num&#x27;: return `${f}.${l}${randNum()}`;
    case &#x27;user_plain&#x27;: return `${f}${l}`;
    case &#x27;user_underscore_middle&#x27;: return `${f}_${m}_${l}`;
    case &#x27;user_dot_middle&#x27;: return `${f}.${m}.${l}`;
    default: return `${f}_${l}${randNum()}`;
  }
}

const NAME_ROW_HEIGHT = 33;
const NAME_ROW_BUFFER = 12;

function setupVirtualNameList(container, items, rowRenderer) {
  container.innerHTML = &#x27;&lt;div class=&quot;v-phantom&quot; style=&quot;position:relative&quot;&gt;&lt;div class=&quot;v-rows&quot; style=&quot;position:absolute;top:0;left:0;right:0&quot;&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
  const phantom = container.querySelector(&#x27;.v-phantom&#x27;);
  const rows = container.querySelector(&#x27;.v-rows&#x27;);
  phantom.style.height = (items.length * NAME_ROW_HEIGHT) + &#x27;px&#x27;;

  function paint() {
    const scrollTop = container.scrollTop;
    const viewH = container.clientHeight || 220;
    let start = Math.floor(scrollTop / NAME_ROW_HEIGHT) - NAME_ROW_BUFFER;
    let end = Math.ceil((scrollTop + viewH) / NAME_ROW_HEIGHT) + NAME_ROW_BUFFER;
    start = Math.max(0, start);
    end = Math.min(items.length, end);
    rows.style.top = (start * NAME_ROW_HEIGHT) + &#x27;px&#x27;;
    let html = &#x27;&#x27;;
    for (let i = start; i &lt; end; i++) html += rowRenderer(items[i], i);
    rows.innerHTML = html;
  }

  container.onscroll = function(){ paint(); if(container._syncing){return;} var otherId = container.id==='fullNameList' ? 'usernameList' : (container.id==='usernameList' ? 'fullNameList' : null); if(!otherId) return; var other = document.getElementById(otherId); if(!other) return; other._syncing = true; other.scrollTop = container.scrollTop; requestAnimationFrame(function(){ other._syncing = false; }); };
  paint();
}

function generateNames() {
  const countInput = document.getElementById(&#x27;nameCount&#x27;);
  let count = parseInt(countInput.value, 10);
  if (!count || count &lt; 1) count = 1;
  if (count &gt; 50000) { count = 50000; countInput.value = 50000; showToast(&#x27;Maksimal 50.000 per batch&#x27;, &#x27;warning&#x27;); }

  const usernameFormat = document.getElementById(&#x27;nameFormat&#x27;).value;
  const includeMiddleInFullName = document.getElementById(&#x27;toggleNameMiddle&#x27;).classList.contains(&#x27;active&#x27;);
  const lowercase = document.getElementById(&#x27;toggleNameLower&#x27;).classList.contains(&#x27;active&#x27;);
  const ensureUnique = document.getElementById(&#x27;toggleNameUnique&#x27;).classList.contains(&#x27;active&#x27;);

  const btn = document.getElementById(&#x27;btnGenerateNames&#x27;);
  btn.classList.add(&#x27;loading&#x27;);

  // Generate secara chunked (async) supaya UI tidak freeze untuk jumlah besar
  const fullNames = [];
  const usernames = [];
  const seen = new Set();
  const maxAttempts = count * 50; // batas aman supaya tidak infinite loop kalau unik diminta lebih dari kombinasi yang ada
  let attempts = 0;
  const CHUNK = 2000;

  function step() {
    const chunkEnd = Math.min(attempts + CHUNK, maxAttempts);
    while (attempts &lt; chunkEnd &amp;&amp; fullNames.length &lt; count) {
      const identity = buildIdentity();
      attempts++;
      const fullName = formatFullName(identity, includeMiddleInFullName);
      const username = formatUsername(identity, usernameFormat, lowercase);
      // Kunci duplikat HARUS mengikuti output yang benar-benar ditampilkan
      // (Full Name + Username), bukan field mentah identitas. Kalau hanya
      // field identitas yang dicek, dua identitas bisa dianggap &quot;unik&quot;
      // (mis. middle beda) padahal format username yang dipakai tidak
      // menampilkan middle sama sekali → username-nya jadi kembar walau
      // toggle &quot;tidak ada duplikat&quot; aktif.
      const key = `${fullName}|${username}`;
      if (ensureUnique) {
        if (seen.has(key)) continue;
        seen.add(key);
      }
      fullNames.push(fullName);
      usernames.push(username);
    }

    if (fullNames.length &lt; count &amp;&amp; attempts &lt; maxAttempts) {
      // lanjut chunk berikutnya di frame berikutnya, biar browser sempat &quot;bernapas&quot;
      setTimeout(step, 0);
      return;
    }

    btn.classList.remove(&#x27;loading&#x27;);

    if (ensureUnique &amp;&amp; fullNames.length &lt; count) {
      showToast(`Hanya bisa generate ${fullNames.length} identitas unik (kombinasi tersedia terbatas)`, &#x27;warning&#x27;);
    }

    renderNameCards(fullNames, usernames);
    showToast(`${fullNames.length} nama &amp; username berhasil dibuat!`, &#x27;success&#x27;);
  }

  step();
}

// ══════════════════════════════════════════════
// GENERATE KODE OTP (TOTP asli, RFC 6238) DARI SECRET KEY
// Implementasi SHA1/HMAC murni JS (tanpa crypto.subtle) supaya tetap
// jalan walau file dibuka langsung lewat file:// di browser yang
// membatasi Web Crypto API ke secure context.
// ══════════════════════════════════════════════
const OTP_PERIOD = 30;
const OTP_DIGITS = 6;
let otpLastCounter = null;
let otpTimerStarted = false;

function sha1(bytesIn) {
  function rotl(n, s) { return ((n &lt;&lt; s) | (n &gt;&gt;&gt; (32 - s))) &gt;&gt;&gt; 0; }
  const bytes = Array.from(bytesIn);
  const ml = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  bytes.push(0, 0, 0, 0);
  bytes.push((ml &gt;&gt;&gt; 24) &amp; 0xff, (ml &gt;&gt;&gt; 16) &amp; 0xff, (ml &gt;&gt;&gt; 8) &amp; 0xff, ml &amp; 0xff);

  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;

  for (let chunkStart = 0; chunkStart &lt; bytes.length; chunkStart += 64) {
    const w = new Array(80);
    for (let i = 0; i &lt; 16; i++) {
      w[i] = ((bytes[chunkStart + i * 4] &lt;&lt; 24) | (bytes[chunkStart + i * 4 + 1] &lt;&lt; 16) |
              (bytes[chunkStart + i * 4 + 2] &lt;&lt; 8) | (bytes[chunkStart + i * 4 + 3])) &gt;&gt;&gt; 0;
    }
    for (let i = 16; i &lt; 80; i++) w[i] = rotl(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);

    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i &lt; 80; i++) {
      let f, k;
      if (i &lt; 20) { f = (b &amp; c) | ((~b) &amp; d); k = 0x5A827999; }
      else if (i &lt; 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i &lt; 60) { f = (b &amp; c) | (b &amp; d) | (c &amp; d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const temp = (rotl(a, 5) + f + e + k + w[i]) &gt;&gt;&gt; 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = temp;
    }
    h0 = (h0 + a) &gt;&gt;&gt; 0; h1 = (h1 + b) &gt;&gt;&gt; 0; h2 = (h2 + c) &gt;&gt;&gt; 0; h3 = (h3 + d) &gt;&gt;&gt; 0; h4 = (h4 + e) &gt;&gt;&gt; 0;
  }

  const out = new Uint8Array(20);
  [h0, h1, h2, h3, h4].forEach((h, idx) =&gt; {
    out[idx * 4] = (h &gt;&gt;&gt; 24) &amp; 0xff;
    out[idx * 4 + 1] = (h &gt;&gt;&gt; 16) &amp; 0xff;
    out[idx * 4 + 2] = (h &gt;&gt;&gt; 8) &amp; 0xff;
    out[idx * 4 + 3] = h &amp; 0xff;
  });
  return out;
}

function hmacSha1(keyBytes, msgBytes) {
  const blockSize = 64;
  let key = Array.from(keyBytes);
  if (key.length &gt; blockSize) key = Array.from(sha1(new Uint8Array(key)));
  while (key.length &lt; blockSize) key.push(0);
  const ipad = key.map(b =&gt; b ^ 0x36);
  const opad = key.map(b =&gt; b ^ 0x5c);
  const innerHash = sha1(new Uint8Array([...ipad, ...msgBytes]));
  return sha1(new Uint8Array([...opad, ...innerHash]));
}

// Secret OTP yang valid HANYA boleh berisi huruf A-Z dan angka 2-7
// (alfabet Base32 RFC4648), dengan panjang minimal 16 karakter (setara
// 80-bit) — itu standar minimum yang dipakai Google/Meta/GitHub dkk.
// Kalau tidak memenuhi ini, dianggap BUKAN secret key asli.
function isValidBase32Secret(secret) {
  const clean = secret.replace(/=+$/, &#x27;&#x27;);
  if (clean.length &lt; 16) return false;
  return /^[A-Z2-7]+$/i.test(clean);
}

function base32Decode(input) {
  const alphabet = &#x27;ABCDEFGHIJKLMNOPQRSTUVWXYZ234567&#x27;;
  const clean = String(input).toUpperCase().replace(/=+$/, &#x27;&#x27;);
  let bits = &#x27;&#x27;;
  for (const c of clean) {
    const val = alphabet.indexOf(c);
    if (val === -1) continue;
    bits += val.toString(2).padStart(5, &#x27;0&#x27;);
  }
  const bytes = [];
  for (let i = 0; i + 8 &lt;= bits.length; i += 8) bytes.push(parseInt(bits.substr(i, 8), 2));
  return new Uint8Array(bytes);
}

function totpCode(secretBytes, period, digits, timeSec) {
  const counter = Math.floor(timeSec / period);
  const msg = new Uint8Array(8);
  let c = counter;
  for (let i = 7; i &gt;= 0; i--) { msg[i] = c &amp; 0xff; c = Math.floor(c / 256); }
  const hmac = hmacSha1(secretBytes, msg);
  const offset = hmac[19] &amp; 0xf;
  const binCode = ((hmac[offset] &amp; 0x7f) &lt;&lt; 24) | ((hmac[offset + 1] &amp; 0xff) &lt;&lt; 16) |
                  ((hmac[offset + 2] &amp; 0xff) &lt;&lt; 8) | (hmac[offset + 3] &amp; 0xff);
  const mod = Math.pow(10, digits);
  return (binCode % mod).toString().padStart(digits, &#x27;0&#x27;);
}

function parseOtpSecrets(text) {
  return text.split(&#x27;\n&#x27;)
    .map(l =&gt; l.trim())
    .filter(l =&gt; l.length &gt; 0)
    .map((line, idx) =&gt; {
      let label = &#x27;Key &#x27; + (idx + 1);
      let secretRaw = line;
      const colonIdx = line.indexOf(&#x27;:&#x27;);
      if (colonIdx &gt; -1) {
        const maybeLabel = line.slice(0, colonIdx).trim();
        if (maybeLabel) label = maybeLabel;
        secretRaw = line.slice(colonIdx + 1).trim();
      }
      return { label, secret: secretRaw.replace(/\s+/g, &#x27;&#x27;) };
    });
}

function onOtpSecretsInput() {
  computeAndRenderOtp();
}

function computeAndRenderOtp() {
  const text = document.getElementById(&#x27;otpSecrets&#x27;).value;
  const entries = parseOtpSecrets(text);
  const keyBadge = document.getElementById(&#x27;otpKeyBadge&#x27;);
  const empty = document.getElementById(&#x27;otpEmpty&#x27;);
  const list = document.getElementById(&#x27;otpList&#x27;);
  const resultBadge = document.getElementById(&#x27;otpResultBadge&#x27;);

  keyBadge.textContent = entries.length + &#x27; key&#x27;;

  if (!entries.length) {
    empty.style.display = &#x27;&#x27;;
    list.style.display = &#x27;none&#x27;;
    list.innerHTML = &#x27;&#x27;;
    resultBadge.textContent = &#x27;0 kode&#x27;;
    window._otpCodes = [];
    ensureOtpTimer();
    return;
  }

  const nowSec = Math.floor(Date.now() / 1000);
  const remaining = OTP_PERIOD - (nowSec % OTP_PERIOD);

  const codes = entries.map(entry =&gt; {
    try {
      if (!isValidBase32Secret(entry.secret)) throw new Error(&#x27;bukan format secret Base32 yang valid&#x27;);
      const secretBytes = base32Decode(entry.secret);
      if (secretBytes.length &lt; 10) throw new Error(&#x27;secret terlalu pendek&#x27;);
      const code = totpCode(secretBytes, OTP_PERIOD, OTP_DIGITS, nowSec);
      return { label: entry.label, code, error: false };
    } catch (e) {
      return { label: entry.label, code: null, error: true };
    }
  });

  window._otpCodes = codes;
  resultBadge.textContent = codes.length + &#x27; kode&#x27;;
  empty.style.display = &#x27;none&#x27;;
  list.style.display = &#x27;block&#x27;;

  list.innerHTML = codes.map((c, i) =&gt; `
    &lt;div class=&quot;bulk-item&quot; id=&quot;otpList-item-${i}&quot;&gt;
      &lt;div class=&quot;bulk-item-num&quot;&gt;${i + 1}&lt;/div&gt;
      &lt;div class=&quot;bulk-item-body&quot;&gt;
        &lt;div class=&quot;bulk-item-short&quot; style=&quot;font-size:15px;letter-spacing:.1em;${c.error ? &#x27;color:var(--error)&#x27; : &#x27;&#x27;}&quot;&gt;${c.error ? &#x27;Secret tidak valid&#x27; : c.code}&lt;/div&gt;
        &lt;div style=&quot;font-size:9px;color:var(--text-dim);margin-top:2px&quot;&gt;${escHtml(c.label)}${c.error ? &#x27;&#x27; : ` · refresh &lt;span id=&quot;otp-cd-${i}&quot;&gt;${remaining}&lt;/span&gt;s`}&lt;/div&gt;
      &lt;/div&gt;
      ${c.error ? &#x27;&#x27; : `
      &lt;button class=&quot;bulk-item-copy&quot; title=&quot;Copy&quot; onclick=&quot;copySingleOtp(${i})&quot;&gt;
        &lt;svg viewBox=&quot;0 0 24 24&quot; class=&quot;icon-xs&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&gt;
          &lt;rect x=&quot;9&quot; y=&quot;9&quot; width=&quot;13&quot; height=&quot;13&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1&quot;/&gt;
        &lt;/svg&gt;
      &lt;/button&gt;`}
    &lt;/div&gt;
  `).join(&#x27;&#x27;);

  otpLastCounter = Math.floor(nowSec / OTP_PERIOD);
  ensureOtpTimer();
}

function ensureOtpTimer() {
  if (otpTimerStarted) return;
  otpTimerStarted = true;
  setInterval(() =&gt; {
    if (state.mode !== &#x27;2fa&#x27;) return;
    const text = document.getElementById(&#x27;otpSecrets&#x27;).value;
    if (!text.trim()) return;

    const nowSec = Math.floor(Date.now() / 1000);
    const counter = Math.floor(nowSec / OTP_PERIOD);
    const remaining = OTP_PERIOD - (nowSec % OTP_PERIOD);

    if (counter !== otpLastCounter) {
      computeAndRenderOtp();
    } else {
      (window._otpCodes || []).forEach((c, i) =&gt; {
        const el = document.getElementById(&#x27;otp-cd-&#x27; + i);
        if (el) el.textContent = remaining;
      });
    }
  }, 1000);
}

function resetOtp() {
  document.getElementById(&#x27;otpSecrets&#x27;).value = &#x27;&#x27;;
  computeAndRenderOtp();
  showToast(&#x27;Direset&#x27;, &#x27;info&#x27;);
}

function copySingleOtp(i) {
  const entry = (window._otpCodes || [])[i];
  if (!entry || !entry.code) return;
  copyText(entry.code)
    .then(() =&gt; showToast(&#x27;Kode disalin!&#x27;, &#x27;success&#x27;))
    .catch(() =&gt; showToast(&#x27;Gagal menyalin&#x27;, &#x27;error&#x27;));
}

function copyAllOtp() {
  const codes = (window._otpCodes || []).filter(c =&gt; c.code).map(c =&gt; `${c.label}: ${c.code}`);
  if (!codes.length) { showToast(&#x27;Belum ada kode untuk disalin&#x27;, &#x27;warning&#x27;); return; }
  copyText(codes.join(&#x27;\n&#x27;))

    .catch(() =&gt; showToast(&#x27;Gagal menyalin&#x27;, &#x27;error&#x27;));
}

    .iconbtn {

      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .iconbtn:hover { background: var(--text); color: var(--bg-card); border-color: var(--text); }
    .iconbtn svg { width: 16px; height: 16px; }
    .iconbtn.gmail:hover { background: var(--bg-card); color: var(--text-muted); border-color: var(--gold); }

    .iconbtn.fb:hover { background: #1877f2; color: #fff; border-color: #1877f2; }
    .iconbtn.rm:hover { background: var(--error); color: #fff; border-color: var(--error); }
    .iconbtn:disabled { opacity: 0.35; cursor: not-allowed; }
    .gmail-select {
      flex: 1;
      min-width: 0;
      height: 36px;
      font-size: 11px;
      font-family: var(--font);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 8px;
      outline: none;
      padding: 0 10px;
      cursor: pointer;
    }
    .gmail-select:focus { border-color: var(--accent); }
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
    }
    .toast {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      max-width: 320px;
      font-size: 11px;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.3s;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--error); }
    .toast.info { border-left: 3px solid var(--info); }
    .toast.warning { border-left: 3px solid var(--warning); }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100%); }
      to { opacity: 1; transform: translateX(0); }
    }
    .hint {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .hint code {
      background: var(--bg-elevated);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: color-mix(in oklab, #000 55%, transparent);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 16px;
      animation: fadeIn 0.2s;
    }
    .modal-backdrop.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 460px;
      overflow: hidden;
      animation: popIn 0.22s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, color-mix(in oklab, var(--gold) 6%, transparent), transparent);
    }
    .modal-header h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--text);
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .modal-close:hover { background: var(--bg-elevated); color: var(--text); }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; }

    async function apiFetch(base, path, opts = {}) {
      const res = await fetch(base + path, { credentials: &#x27;omit&#x27;, ...opts });
      const txt = await res.text();
      let data;
      try { data = JSON.parse(txt); } catch { data = { error: txt }; }
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    function updateWorkerBadge() {

        const opt = document.createElement(&#x27;option&#x27;);

    async function loadAccounts() {

    function connectGmail() {
      const url = normUrl(workerUrlInput.value);
      if (!url) { showToast(&#x27;Simpan Koneksi terlebih dahulu&#x27;, &#x27;error&#x27;); openWorkerModal(); return; }
      // Redirect balik ke top-window (bukan iframe), ditandai popup=1 supaya jendela popup menutup diri
      var topWin = window;

      var base = topWin.location.origin + topWin.location.pathname;
      var redirect = base + &#x27;?otp_connected=1&amp;popup=1&#x27;;
      var target = url + &#x27;/auth?redirect=&#x27; + encodeURIComponent(redirect);
      // Buka Google OAuth di popup (Google memblokir consent screen di dalam iframe)
      var w = 500, h = 650;
      var sw = (window.screen &amp;&amp; screen.width)  || 1024;
      var sh = (window.screen &amp;&amp; screen.height) || 768;
      var x = Math.max(0, Math.floor((sw - w) / 2));
      var y = Math.max(0, Math.floor((sh - h) / 2));
      var features = &#x27;width=&#x27;+w+&#x27;,height=&#x27;+h+&#x27;,left=&#x27;+x+&#x27;,top=&#x27;+y+&#x27;,menubar=no,toolbar=no,location=yes,status=no,resizable=yes,scrollbars=yes&#x27;;

        return;

      try { popup.focus(); } catch (e) {}
      showToast(&#x27;Menunggu izin di jendela popup...&#x27;, &#x27;info&#x27;);
      function onMsg(ev) {
        var d = ev &amp;&amp; ev.data;

        window.removeEventListener(&#x27;message&#x27;, onMsg);
        clearInterval(poll);
        showToast(d.email ? (&#x27;Gmail terhubung: &#x27; + d.email) : &#x27;Gmail terhubung&#x27;, &#x27;success&#x27;);
        loadAccounts();
      }
      window.addEventListener(&#x27;message&#x27;, onMsg);
      // Fallback: kalau user menutup popup manual, tetap muat ulang daftar akun
      var poll = setInterval(function () {
        if (popup.closed) {
          clearInterval(poll);
          window.removeEventListener(&#x27;message&#x27;, onMsg);
          loadAccounts();
        }
      }, 800);
    }

    async function getOtp(kind) {
      const selected = accountSelect.value;
      if (!selected) return;
      lastOtpKind = kind;
      refreshOtpBtn.disabled = false;
      const label = kind.toUpperCase();
      clearPreview();
      setPreviewText(`Mengambil OTP ${label} terbaru untuk ${selected}...`);
      try {
        const path = (kind === &#x27;ig&#x27; ? &#x27;/get-ig-otp&#x27; : &#x27;/get-fb-otp&#x27;) + &#x27;?email=&#x27; + encodeURIComponent(selected);
        const data = await apiFetch(normUrl(workerUrlInput.value), path);
        if (data.otp) {
          setPreviewItems([
            { label: `${label} OTP`, value: data.otp },
            { label: &#x27;Email&#x27;, value: selected },
            { label: &#x27;Subjek&#x27;, value: data.subject || &#x27;-&#x27; },
            { label: &#x27;Waktu&#x27;, value: formatWaktu(data.date) },
            { label: &#x27;Dari&#x27;, value: data.from || &#x27;-&#x27; },
          ]);
          showToast(`OTP ${label} siap`, &#x27;success&#x27;);
        } else {
          setPreviewText(`OTP tidak ditemukan — ${data.message || &#x27;Tidak ada email cocok terbaru&#x27;}`);
          showToast(&#x27;OTP tidak ditemukan&#x27;, &#x27;error&#x27;);
        }
      } catch (err) {
        setPreviewText(&#x27;Kesalahan: &#x27; + (err.message || err));
        showToast(&#x27;Gagal mengambil data&#x27;, &#x27;error&#x27;);
      }
    }

    function copyEmail() {
      const selected = accountSelect.value;

      copyText(selected, &#x27;Email copied&#x27;);

    function copyText(text, label) {
      navigator.clipboard.writeText(text)
        .then(() =&gt; showToast(`${label}: ${text}`, &#x27;success&#x27;))
        .catch(() =&gt; showToast(&#x27;Gagal menyalin&#x27;, &#x27;error&#x27;));
    }

    async function removeAccount() {
      const selected = accountSelect.value;
      if (!selected) return;
      if (!window.confirm(`Hapus akun Gmail &quot;${selected}&quot;?`)) return;
      try {
        await apiFetch(normUrl(workerUrlInput.value), &#x27;/remove-account?email=&#x27; + encodeURIComponent(selected), { method: &#x27;POST&#x27; });
        showToast(&#x27;Akun dihapus: &#x27; + selected, &#x27;success&#x27;);

    function setPreviewText(text) {

function formatWaktu(str) {
      if (!str) return &#x27;-&#x27;;
      var hari = [&#x27;Minggu&#x27;,&#x27;Senin&#x27;,&#x27;Selasa&#x27;,&#x27;Rabu&#x27;,&#x27;Kamis&#x27;,&#x27;Jumat&#x27;,&#x27;Sabtu&#x27;];

      var dt = new Date(str);
      if (isNaN(dt.getTime())) return str;
      // Konversi ke WIB (UTC+7)
      var wib = new Date(dt.getTime() + 7 * 3600 * 1000);
      var pad = function(n){ return String(n).padStart(2,&#x27;0&#x27;); };
      return hari[wib.getUTCDay()] + &#x27;, &#x27; + wib.getUTCDate() + &#x27; &#x27; + bulan[wib.getUTCMonth()] + &#x27; &#x27; + wib.getUTCFullYear() + &#x27; pukul &#x27; + pad(wib.getUTCHours()) + &#x27;:&#x27; + pad(wib.getUTCMinutes()) + &#x27;:&#x27; + pad(wib.getUTCSeconds()) + &#x27; WIB&#x27;;
    }

        function setPreviewItems(items) {

    function applyTheme() {

    // Init

    // Cek parameter otp_connected baik di iframe maupun di top-window (wrapper)

    saveBtn.addEventListener(&#x27;click&#x27;, saveWorker);

.btn-inline.danger { color: var(--error); border-color: var(--error) }

.float-input { position: relative; margin-bottom: 10px }
.float-input input, .float-input select, .float-input textarea { width: 100%; min-height: 44px; padding: 16px 10px 4px; font-family: var(--font); font-size: 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; transition: border-color .2s; resize: vertical }
.float-input textarea { min-height: 72px; padding-top: 18px }
.float-input input:focus, .float-input select:focus, .float-input textarea:focus { border-color: var(--accent); box-shadow: var(--ring) }
.float-label { position: absolute; top: 6px; left: 10px; font-size: 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); pointer-events: none }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr } }

.actions-row { display: flex; gap: 8px; margin-top: 4px }

.result-card { display: none; margin: 0 16px 16px; padding: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-left: 3px solid var(--success); border-radius: 8px }
.result-card.visible { display: block }

.result-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 8px }

.result-meta { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; margin-top: 6px }

.toast-container { display: flex; flex-direction: column; gap: 8px; pointer-events: none; position: fixed; bottom: 20px; right: 20px; z-index: 9999 }
.toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); align-items: center; gap: 8px; max-width: 320px; padding: 12px 16px; font-size: 11px; animation: .3s slideIn; display: flex; box-shadow: var(--shadow-lg) }

.icon { flex-shrink: 0; width: 14px; height: 14px }
.icon-sm { width: 12px; height: 12px }

@keyframes slideIn { 0% { opacity: 0; transform: translate(100%) } to { opacity: 1; transform: translate(0) } }
@keyframes spin { to { transform: rotate(360deg) } }

&lt;script&gt;
// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const THEME_KEY = &#x27;nrb_theme&#x27;;
const TOKEN_KEY = &#x27;nrb_token&#x27;; // sessionStorage only
let state = { theme: &#x27;light&#x27; };

function init() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) state.theme = saved;
  } catch(e) {}
  applyTheme();
  // Restore token from session
  try {
    const t = sessionStorage.getItem(TOKEN_KEY);
    if (t) { document.getElementById(&#x27;token&#x27;).value = t; setTokenStatus(true); }
  } catch(e) {}
}
function toggleTheme() {
  state.theme = state.theme === &#x27;night&#x27; ? &#x27;light&#x27; : &#x27;night&#x27;;
  applyTheme();
  try { localStorage.setItem(THEME_KEY, state.theme); } catch(e) {}
}
function applyTheme() {
  document.body.classList.toggle(&#x27;night&#x27;, state.theme === &#x27;night&#x27;); var _m=document.getElementById(&#x27;colorSchemeMeta&#x27;); if(_m) _m.setAttribute(&#x27;content&#x27;, state.theme===&#x27;night&#x27;?&#x27;dark&#x27;:&#x27;light&#x27;);
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
function showToast(msg, type = &#x27;info&#x27;) {
  const container = document.getElementById(&#x27;toastContainer&#x27;);
  const toast = document.createElement(&#x27;div&#x27;);
  toast.className = &#x27;toast &#x27; + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() =&gt; toast.remove(), 3800);
}
function copyText(text) {
  if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) =&gt; {
    try {
      const ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; ta.style.position = &#x27;fixed&#x27;; ta.style.opacity = &#x27;0&#x27;;
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand(&#x27;copy&#x27;); document.body.removeChild(ta); resolve();
    } catch(e) { reject(e); }
  });
}

// ══════════════════════════════════════════════
// TOKEN
// ══════════════════════════════════════════════
function setTokenStatus(active) {
  const el = document.getElementById(&#x27;tokenStatus&#x27;);
  const txt = document.getElementById(&#x27;tokenStatusText&#x27;);
  el.classList.toggle(&#x27;active&#x27;, !!active);
  txt.textContent = active ? &#x27;API: Connected&#x27; : &#x27;API: Disconnected&#x27;;
}
function openTokenModal() {
  document.getElementById(&#x27;tokenModal&#x27;).classList.add(&#x27;visible&#x27;);
  setTimeout(() =&gt; document.getElementById(&#x27;token&#x27;).focus(), 50);
}
function closeTokenModal() {
  document.getElementById(&#x27;tokenModal&#x27;).classList.remove(&#x27;visible&#x27;);
}
document.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {

  &lt;meta property=&quot;og:image:width&quot; content=&quot;${escapeAttr(width)}&quot;&gt;
  &lt;meta property=&quot;og:image:height&quot; content=&quot;${escapeAttr(height)}&quot;&gt;
  &lt;meta property=&quot;og:image:alt&quot; content=&quot;${escapeAttr(t)}&quot;&gt;

${img}

// NETLIFY API
// ══════════════════════════════════════════════
const API = &#x27;https://api.netlify.com/api/v1&#x27;;

async function netlifyFetch(token, path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      &#x27;Authorization&#x27;: &#x27;Bearer &#x27; + token,
      ...(opts.headers || {})
    }
  });
  const txt = await res.text();
  let data; try { data = txt ? JSON.parse(txt) : null; } catch(e) { data = txt; }
  if (!res.ok) {
    const msg = (data &amp;&amp; data.message) || (typeof data === &#x27;string&#x27; ? data : &#x27;&#x27;) || (&#x27;HTTP &#x27; + res.status);
    throw new Error(msg);
  }
  return data;
}

async function createSite(token, name) {
  return netlifyFetch(token, &#x27;/sites&#x27;, {
    method: &#x27;POST&#x27;,
    headers: { &#x27;Content-Type&#x27;: &#x27;application/json&#x27; },
    body: JSON.stringify({ name })
  });
}

async function createDeploy(token, siteId, filesDigest) {
  return netlifyFetch(token, `/sites/${siteId}/deploys`, {
    method: &#x27;POST&#x27;,
    headers: { &#x27;Content-Type&#x27;: &#x27;application/json&#x27; },
    body: JSON.stringify({ files: filesDigest, async: false })
  });
}

async function uploadDeployFile(token, deployId, path, content) {
  const p = path.startsWith(&#x27;/&#x27;) ? path : &#x27;/&#x27; + path;
  return netlifyFetch(token, `/deploys/${deployId}/files${p}`, {
    method: &#x27;PUT&#x27;,
    headers: { &#x27;Content-Type&#x27;: &#x27;application/octet-stream&#x27; },
    body: content
  });
}

async function getDeploy(token, deployId) {
  return netlifyFetch(token, `/deploys/${deployId}`);
}

// ══════════════════════════════════════════════
// BUILD &amp; DEPLOY
// ══════════════════════════════════════════════
async function buildAndDeploy() {
  const token = getToken();
  const url = document.getElementById(&#x27;redirectUrl&#x27;).value.trim();
  const title = document.getElementById(&#x27;pageTitle&#x27;).value.trim();
  const ogImage = document.getElementById(&#x27;ogImage&#x27;).value.trim();
  const description = document.getElementById(&#x27;ogDesc&#x27;).value.trim();

  if (!token) { showToast(&#x27;Hubungkan API Netlify dulu&#x27;, &#x27;error&#x27;); openTokenModal(); return; }
  if (!url) { showToast(&#x27;Redirect URL wajib diisi&#x27;, &#x27;error&#x27;); return; }
  if (!isValidUrl(url)) { showToast(&#x27;Redirect URL tidak valid (harus http/https)&#x27;, &#x27;error&#x27;); return; }

  const imageSyntax = validateOgImageSyntax(ogImage);
  if (!imageSyntax.ok) { showToast(imageSyntax.message, &#x27;error&#x27;); return; }
  if (imageSyntax.warning) showToast(imageSyntax.warning, &#x27;warning&#x27;);

  const btn = document.getElementById(&#x27;btnBuild&#x27;);
  btn.classList.add(&#x27;loading&#x27;);
  btn.disabled = true;

  const resultCard = document.getElementById(&#x27;resultCard&#x27;);
  resultCard.classList.remove(&#x27;visible&#x27;, &#x27;error&#x27;);

  try {
    let imageInfo = null;
    // OG Image check dinonaktifkan sesuai permintaan: URL dipakai apa adanya.


    // 1) Create site first so og:url + canonical can point to this page, not destination
    showToast(&#x27;Membuat site Netlify…&#x27;, &#x27;info&#x27;);
    let site;
    try {
      site = await createSite(token, randomSiteName());
    } catch (e) {
      // fallback: name collision — retry once with different name
      site = await createSite(token, randomSiteName());
    }
    const pageUrl = normalizePageUrl(site.ssl_url || site.url || (`https://${site.name}.netlify.app/`));

    // 2) Generate crawler-safe files
    const html = buildRedirectHtml({ url, pageUrl, title, description, ogImage, imageInfo });
    const files = { &#x27;/index.html&#x27;: html };
    const filesDigest = {};
    for (const [path, content] of Object.entries(files)) filesDigest[path] = await sha1Hex(content);

    // 3) Create deploy manifest
    showToast(&#x27;Meng-upload file…&#x27;, &#x27;info&#x27;);
    const deploy = await createDeploy(token, site.id, filesDigest);

    // 4) Upload every required file
    const required = Array.isArray(deploy.required) ? deploy.required : [];
    for (const [path, content] of Object.entries(files)) {
      if (required.includes(filesDigest[path])) await uploadDeployFile(token, deploy.id, path, content);
    }

    // 5) Poll for ready
    let finalDeploy = deploy;
    for (let i = 0; i &lt; 20; i++) {
      if (finalDeploy.state === &#x27;ready&#x27; || finalDeploy.state === &#x27;current&#x27;) break;
      if (finalDeploy.state === &#x27;error&#x27;) throw new Error(&#x27;Deploy failed: &#x27; + (finalDeploy.error_message || &#x27;unknown&#x27;));
      await new Promise(r =&gt; setTimeout(r, 1500));
      try { finalDeploy = await getDeploy(token, deploy.id); } catch(e) { break; }
    }

    const finalUrl = pageUrl || finalDeploy.ssl_url || finalDeploy.deploy_ssl_url || site.ssl_url || site.url;
    document.getElementById(&#x27;resultTitle&#x27;).textContent = &#x27;Deploy Success&#x27;;
    const a = document.getElementById(&#x27;resultUrl&#x27;);
    a.href = finalUrl; a.textContent = finalUrl;
    document.getElementById(&#x27;resultMeta&#x27;).textContent = `Site: ${site.name} • State: ${finalDeploy.state || &#x27;ready&#x27;}${ogImage &amp;&amp; imageInfo ? ` • Image: ${imageInfo.width}x${imageInfo.height}` : &#x27;&#x27;}`;
    resultCard.classList.add(&#x27;visible&#x27;);
    showToast(&#x27;Deploy sukses ✔&#x27;, &#x27;success&#x27;);
  } catch (err) {
    console.error(err);
    document.getElementById(&#x27;resultTitle&#x27;).textContent = &#x27;Deploy Gagal&#x27;;
    const a = document.getElementById(&#x27;resultUrl&#x27;);
    a.href = &#x27;#&#x27;; a.textContent = String(err.message || err);
    document.getElementById(&#x27;resultMeta&#x27;).textContent = &#x27;Cek token / koneksi lalu coba lagi.&#x27;;
    resultCard.classList.add(&#x27;visible&#x27;, &#x27;error&#x27;);
    showToast(&#x27;Gagal: &#x27; + (err.message || err), &#x27;error&#x27;);
  } finally {
    btn.classList.remove(&#x27;loading&#x27;);
    btn.disabled = false;
  }
}

.icon-btn:hover { background: var(--text); color: var(--bg-card); border-color: var(--text) }
.theme-icon-moon { display: none }
body.night .theme-icon-sun { display: none }
body.night .theme-icon-moon { display: block }

/* PROGRESS BAR */
.progress-wrap { height: 3px; background: var(--bg-elevated); position: relative; overflow: hidden }
.progress-bar { height: 100%; width: 0%; background: var(--gradient-accent); transition: width .3s ease }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--border) }
.stat-item {
  position: relative; padding: 14px 12px; background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; overflow: hidden;
  transition: background .2s ease;
}
.stat-item:last-child { border-right: none }
.stat-item:hover { background: var(--bg-elevated) }
.stat-item::before {
  content: &quot;&quot;; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: currentColor; opacity: .55;
}
.stat-icon {
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px;
  display: grid; place-items: center;
  background: color-mix(in oklab, currentColor 14%, transparent);
  border: 1px solid color-mix(in oklab, currentColor 28%, transparent);
  color: currentColor;
}
.stat-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.stat-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; line-height: 1 }
.stat-val {
  font-size: 20px; font-weight: 700; letter-spacing: .01em;
  color: var(--text); font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-dim); font-weight: 600;
}
.c-total { color: var(--info) }
.c-live { color: var(--success) }
.c-die { color: var(--error) }
.c-check { color: var(--gold) }
@media (max-width: 520px) {
  .stats { grid-template-columns: repeat(2, 1fr) }
  .stat-item { padding: 12px 10px }
}

.section { padding: 16px; border-bottom: 1px solid var(--border) }
.section-label { text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); font-size: 9px; font-weight: 600; margin-bottom: 10px }

.textarea {
  width: 100%; min-height: 140px; padding: 12px; font-family: var(--font); font-size: 11px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); outline: none; resize: vertical; transition: border-color .2s
}
.textarea:focus { border-color: var(--accent) }
.textarea[readonly] { background: var(--bg-elevated); cursor: text }

.float-input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px }
.float-input { position: relative; flex: 1 }
.float-input input, .float-input select {
  width: 100%; height: 44px; padding: 14px 10px 4px; font-family: var(--font); font-size: 11px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); outline: none; transition: border-color .2s
}
.float-input input:focus, .float-input select:focus { border-color: var(--accent) }
.float-label { position: absolute; top: 6px; left: 10px; font-size: 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); pointer-events: none }

.actions { display: flex; gap: 8px; margin-top: 12px }
.btn-inline {
  text-transform: uppercase; letter-spacing: .04em; background: var(--bg-elevated); height: 44px;
  color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  font-size: 10px; font-weight: 600; font-family: var(--font); white-space: nowrap;
  justify-content: center; align-items: center; gap: 6px; padding: 0 16px; transition: all .2s; display: flex; flex: 1
}
.btn-inline:hover { background: var(--text); border-color: var(--text); color: var(--bg-card) }
.btn-inline:disabled { opacity: .5; cursor: not-allowed; pointer-events: none }
.btn-inline.primary { background: var(--gradient-accent) !important; color: #f5f0e0 !important; border: 1px solid transparent !important; box-shadow: 0 2px 0 0 color-mix(in oklab, var(--accent) 50%, #000), var(--shadow) }
.btn-inline.primary:hover { filter: brightness(1.08); box-shadow: var(--ring), var(--shadow-lg); transform: translateY(-1px) }
.btn-inline.danger { background: var(--gradient-danger) !important; color: #fff !important; border: 1px solid transparent !important }
.btn-inline.danger:hover { filter: brightness(1.08); transform: translateY(-1px) }
.btn-inline.loading { pointer-events: none; opacity: .7 }
.btn-inline.loading .btn-icon { display: none }
.btn-inline.loading .btn-spinner { display: block }
.btn-spinner { animation: 1s linear infinite spin; display: none }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em }
.badge-count { background: var(--gradient-accent); color: #f5f0e0; border: 1px solid transparent; font-weight: 700 }
.badge-die { background: var(--gradient-danger); color: #fff }

/* RESULT CARDS */
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px }
@media (max-width: 560px) { .result-grid { grid-template-columns: 1fr } }
.res-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow) }
.res-card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--bg-elevated); border-bottom: 1px solid var(--border) }
.res-card-header-left { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 8px }
.res-card-header-left.die { border-left-color: var(--error) }
.res-card-header-left svg { flex-shrink: 0 }
.res-card-body { flex: 1; min-height: 200px; display: flex }
.res-content { width: 100%; min-height: 200px; padding: 10px; font-family: var(--font); font-size: 11px; background: var(--bg-card); border: none; color: var(--text); outline: none; resize: none }
.res-content.live { color: var(--success) }
.res-content.die { color: var(--error) }
.res-card-footer { border-top: 1px solid var(--border); padding: 10px }
.res-card-body { flex: 1; min-height: 240px; max-height: 340px; display: block; overflow: hidden; padding: 0 }
.bulk-list { width: 100%; height: 100%; max-height: 340px; overflow-y: auto; background: var(--bg-card); font-family: var(--font); }
.bulk-list .bulk-item { border-bottom: 1px solid var(--border); display: flex; align-items: stretch; height: 33px; box-sizing: border-box; }
.bulk-list .bulk-item:last-child { border-bottom: none }
.bulk-list .bulk-item-num { background: var(--bg-elevated); color: var(--text-dim); font-size: 9px; font-weight: 600; min-width: 28px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); flex-shrink: 0 }
.bulk-list .bulk-item-body { flex: 1; padding: 8px 10px; min-width: 0; display: flex; align-items: center; }
.bulk-list .bulk-item-short { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.bulk-list .bulk-item-short.live { color: var(--success) }
.bulk-list .bulk-item-short.die { color: var(--error) }
.bulk-list .bulk-item-copy { background: none; border: none; border-left: 1px solid var(--border); width: 36px; flex-shrink: 0; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s }
.bulk-list .bulk-item-copy:hover { background: var(--accent); color: #fff }
.bulk-list .bulk-item-copy svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.bulk-empty { padding: 16px; text-align: center; color: var(--text-dim); font-size: 11px; font-style: italic; }


.toast-container { display: flex; flex-direction: column; gap: 8px; pointer-events: none; position: fixed; bottom: 20px; right: 20px; z-index: 100 }
.toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); align-items: center; gap: 8px; max-width: 320px; padding: 12px 16px; font-size: 11px; animation: .3s slideIn; display: flex }
.toast.success { border-left: 3px solid var(--success) }
.toast.error { border-left: 3px solid var(--error) }
.toast.info { border-left: 3px solid var(--info) }
.toast.warning { border-left: 3px solid var(--warning) }

.icon { flex-shrink: 0; width: 14px; height: 14px }
.icon-sm { width: 12px; height: 12px }
.icon-xs { width: 10px; height: 10px }

@keyframes slideIn { 0% { opacity: 0; transform: translate(100%) } to { opacity: 1; transform: translate(0) } }
@keyframes spin { to { transform: rotate(360deg) } }

/* TABS */
.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-elevated) }
.tab-btn {
  flex: 1; padding: 12px 10px; font-family: var(--font); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
  background: transparent; border: none; cursor: pointer; transition: all .2s;
  border-bottom: 2px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tab-btn:hover { color: var(--text) }
.tab-btn.active { color: var(--text); background: var(--bg-card); border-bottom-color: var(--accent) }
.tab-btn svg { width: 14px; height: 14px }
.tab-panel { display: none }
.tab-panel.active { display: block }

const STORAGE_KEY = &#x27;fbcheck_v1_theme&#x27;;

  } catch(e) {}

}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function toggleTheme() {
  state.theme = state.theme === &#x27;night&#x27; ? &#x27;light&#x27; : &#x27;night&#x27;;

function showToast(msg, type = &#x27;info&#x27;) {
  const container = document.getElementById(&#x27;toastContainer&#x27;);
  const toast = document.createElement(&#x27;div&#x27;);
  toast.className = &#x27;toast &#x27; + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() =&gt; toast.remove(), 3500);
}

function copyText(text) {
  if (navigator.clipboard &amp;&amp; navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) =&gt; {
    try {
      const ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text;
      ta.style.position = &#x27;fixed&#x27;;
      ta.style.opacity = &#x27;0&#x27;;
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand(&#x27;copy&#x27;);
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error(&#x27;copy gagal&#x27;));
    } catch(e) { reject(e); }
  });
}

// Cek 1 UID lewat endpoint Facebook Graph picture.
// Live = URL redirect final mengandung &quot;100x100&quot; (foto profil asli type=normal).
// Die  = redirect ke silhouette default / error / timeout.

function checkUid(uid) {
  return new Promise(async (resolve) =&gt; {
    // Buang bagian setelah &quot;|&quot; (kalau format uid|pass|...)
    const id = String(uid).split(&#x27;|&#x27;)[0].trim();
    const url = &#x27;https://graph.facebook.com/&#x27; + encodeURIComponent(id) + &#x27;/picture?type=normal&#x27;;

    const controller = new AbortController();
    const timeoutId = setTimeout(() =&gt; controller.abort(), 4000);

    try {
      const res = await fetch(url, { signal: controller.signal, redirect: &#x27;follow&#x27; });
      clearTimeout(timeoutId);
      // Foto profil live mengembalikan URL CDN dengan segmen 100x100.
      // UID die/invalid akan redirect ke silhouette default (tanpa 100x100).
      if (/100x100/.test(res.url)) {
        resolve(true);
      } else {
        resolve(false);
      }
    } catch (e) {
      clearTimeout(timeoutId);
      resolve(false);
    }
  });
}

async function startCheck() {
  if (checking) {

    showToast(&#x27;Stopping...&#x27;, &#x27;warning&#x27;);

  const raw = document.getElementById(&#x27;inputList&#x27;).value.trim();
  if (!raw) { showToast(&#x27;Isi dulu list UID&#x27;, &#x27;error&#x27;); return; }

  const uids = [...new Set(raw.split(/[\s,;\n\r]+/).map(s =&gt; s.trim()).filter(Boolean))];
  if (!uids.length) { showToast(&#x27;Tidak ada UID valid&#x27;, &#x27;error&#x27;); return; }

  // reset counters
  liveList = []; dieList = [];
  counter = { total: uids.length, live: 0, die: 0, checked: 0 };
  clearBulkList('resLive', 'UID Live akan muncul di sini...');
  clearBulkList('resDie', 'UID Die akan muncul di sini...');
  updateStats();

  checking = true; stopFlag = false;
  setBtnLoading(true);
  showToast(&#x27;Mulai cek &#x27; + uids.length + &#x27; UID&#x27;, &#x27;info&#x27;);

  for (let i = 0; i &lt; uids.length; i++) {
    if (stopFlag) break;
    const uid = uids[i];
    const ok = await checkUid(uid);
    if (ok) { counter.live++; appendResult(uid, true); }
    else    { counter.die++;  appendResult(uid, false); }
    counter.checked++;
    updateStats();
  }


  checking = false;
  setBtnLoading(false);
  showToast(stopFlag ? &#x27;Dihentikan&#x27; : &#x27;Selesai! Live: &#x27; + counter.live + &#x27; | Die: &#x27; + counter.die,
            stopFlag ? &#x27;warning&#x27; : &#x27;success&#x27;);
  if (!stopFlag) {
    showFinishModal(&#x27;Facebook Checker&#x27;, counter, liveList, dieList, &#x27;facebook&#x27;);
  }
}

// Normalisasi input jadi username IG murni.
// Menerima: &quot;user&quot;, &quot;@user&quot;, &quot;https://instagram.com/user/&quot;, &quot;instagram.com/user?igsh=...&quot;
function igNormalize(raw) {
  let s = String(raw).split(&#x27;|&#x27;)[0].trim();
  if (!s) return &#x27;&#x27;;
  s = s.replace(/^@+/, &#x27;&#x27;);
  // Kalau berupa URL, ambil segmen pertama setelah host
  const m = s.match(/(?:https?:\/\/)?(?:www\.)?instagram\.com\/([^\/?#]+)/i);
  if (m) s = m[1];
  // Buang query string / trailing slash
  s = s.split(&#x27;?&#x27;)[0].split(&#x27;#&#x27;)[0].replace(/\/+$/, &#x27;&#x27;).trim();
  return s.toLowerCase();
}

// Cek 1 username IG via r.jina.ai reader untuk halaman embed Instagram.
// Alasan: unavatar.io sekarang sering 403/berbayar sehingga Live/Die tertukar.
// Metode baru membaca teks halaman embed:
// Live = ada profil/followers/posts/view full profile.
// Die  = ada broken/removed/Page Not Found/Sorry page isn&#x27;t available.
const IG_CHECK_TIMEOUT_MS = 12000;

function igIsValidUsername(username) {
  // Username IG hanya huruf, angka, underscore, titik, maksimal 30 karakter.
  // Titik tidak boleh di awal/akhir dan tidak boleh berurutan.
  return /^[a-z0-9._]{1,30}$/i.test(username) &amp;&amp;
         !username.startsWith(&#x27;.&#x27;) &amp;&amp;
         !username.endsWith(&#x27;.&#x27;) &amp;&amp;
         !username.includes(&#x27;..&#x27;);
}

async function igFetchText(url, timeoutMs = IG_CHECK_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() =&gt; controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      signal: controller.signal,
      cache: &#x27;no-store&#x27;,
      headers: { &#x27;Accept&#x27;: &#x27;text/plain,*/*&#x27; }
    });
    const text = await res.text();
    return { ok: res.ok, status: res.status, text };
  } catch (e) {
    return { ok: false, status: 0, text: &#x27;&#x27; };
  } finally {
    clearTimeout(timer);
  }
}

// Retry wrapper: r.jina.ai sering 429/5xx/timeout saat skala besar.
// Kita retry hanya untuk failure jaringan/rate-limit, bukan untuk verdict.
function __sleep(ms){ return new Promise(r =&gt; setTimeout(r, ms)); }
async function igFetchTextRetry(url, attempts = 6) {
  let last = { ok:false, status:0, text:&#x27;&#x27; };
  for (let i = 0; i &lt; attempts; i++) {
    const r = await igFetchText(url);
    last = r;
    const failed = !r.ok || !r.text || r.status === 429 || r.status &gt;= 500 || r.status === 0;
    if (!failed) return r;
    // backoff jittered — retry sampai dapat respon valid
    await __sleep(600 * Math.pow(2, Math.min(i,5)) + Math.floor(Math.random()*500));
  }
  return last;
}

function igAnalyzeText(username, text, sourceType) {
  if (!text) return &#x27;unknown&#x27;;

  const u = username.toLowerCase();
  const body = text.toLowerCase();

  // Sinyal DIE harus dicek paling dulu agar akun invalid tidak masuk Live.
  const dieSignals = [
    &quot;sorry, this page isn&#x27;t available&quot;,
    &#x27;sorry, this page isn’t available&#x27;,
    &#x27;page not found&#x27;,
    &#x27;target url returned error 404&#x27;,
    &#x27;warning: target url returned error 404&#x27;,
    &#x27;the link to this profile may be broken&#x27;,
    &#x27;the profile may have been removed&#x27;,
    &#x27;utm_campaign=invalid&#x27;,
    &#x27;content unavailable&#x27;
  ];
  if (dieSignals.some((signal) =&gt; body.includes(signal))) return &#x27;die&#x27;;

  // Sinyal LIVE dari halaman embed profil.
  const liveSignals = [
    `${u}&#x27;s profile picture`,
    `${u}’s profile picture`,
    &#x27; followers&#x27;,
    &#x27; follower&#x27;,
    &#x27; posts&#x27;,
    &#x27; post&#x27;,
    &#x27;view full profile on instagram&#x27;,
    &#x27;no posts yet&#x27;
  ];
  if (liveSignals.some((signal) =&gt; body.includes(signal))) return &#x27;live&#x27;;

  // Endpoint profile biasa sering cuma menampilkan login wall untuk semua akun,
  // jadi jangan dianggap Live kecuali ada sinyal profil eksplisit di atas.
  if (sourceType === &#x27;profile&#x27;) return &#x27;unknown&#x27;;

  return &#x27;unknown&#x27;;
}

async function igCheckUser(username) {
  if (!username || !igIsValidUsername(username)) return false;

  const u = encodeURIComponent(username);
  const cacheBust = Date.now() + &#x27;-&#x27; + Math.random().toString(36).slice(2);
  const sources = [
    // Sumber paling akurat: embed membedakan profil valid vs broken/removed.
    { type: &#x27;embed&#x27;, url: `https://r.jina.ai/http://https://www.instagram.com/${u}/embed/?__ig_checker=${cacheBust}` },
    // Fallback: endpoint lama masih jelas 404 untuk sebagian akun mati.
    { type: &#x27;api&#x27;, url: `https://r.jina.ai/http://https://www.instagram.com/${u}/?__a=1&amp;__d=dis&amp;__ig_checker=${cacheBust}` },
    // Fallback terakhir hanya dipakai untuk sinyal 404 eksplisit, bukan login wall.
    { type: &#x27;profile&#x27;, url: `https://r.jina.ai/http://https://www.instagram.com/${u}/?__ig_checker=${cacheBust}` }
  ];

  for (const source of sources) {
    const result = await igFetchTextRetry(source.url);
    const verdict = igAnalyzeText(username, result.text, source.type);
    if (verdict === &#x27;live&#x27;) return true;
    if (verdict === &#x27;die&#x27;) return false;
  }

  // Semua source ambigu (kemungkinan besar rate-limit) — tandai unknown supaya di-retry di akhir.
  return &#x27;unknown&#x27;;
}

  const raw = document.getElementById(&#x27;igInputList&#x27;).value.trim();
  if (!raw) { showToast(&#x27;Isi dulu list username IG&#x27;, &#x27;error&#x27;); return; }

  )];

  igLiveList = []; igDieList = [];

  const IG_CONCURRENCY = 4;

  async function igWorker() {
    while (!igStopFlag) {

  await Promise.all(Array.from({length: Math.min(IG_CONCURRENCY, users.length)}, igWorker));

    (dieArr.join(&#x27;\n&#x27;) || &#x27;(kosong)&#x27;) + &#x27;\n&#x27;;
  const blob = new Blob([content], { type: &#x27;text/plain;charset=utf-8&#x27; });

// ══════════════════════════════════════════════
// THREADS CHECKER
// ══════════════════════════════════════════════
let thChecking = false;
let thStopFlag = false;
let thLiveList = [];
let thDieList = [];
let thCounter = { total: 0, live: 0, die: 0, checked: 0 };

function thUpdateStats() {
  document.getElementById(&#x27;th-s-total&#x27;).textContent = thCounter.total;
  document.getElementById(&#x27;th-s-live&#x27;).textContent = thCounter.live;
  document.getElementById(&#x27;th-s-die&#x27;).textContent = thCounter.die;
  document.getElementById(&#x27;th-s-check&#x27;).textContent = thCounter.checked;
  document.getElementById(&#x27;thBadgeLive&#x27;).textContent = thCounter.live + &#x27; item&#x27;;
  document.getElementById(&#x27;thBadgeDie&#x27;).textContent = thCounter.die + &#x27; item&#x27;;
}
function thAppendResult(u, isLive) {
  if (isLive) { thLiveList.push(u); renderBulkList(&#x27;thResLive&#x27;, thLiveList, &#x27;live&#x27;, &#x27;copySingleThLive&#x27;); }
  else { thDieList.push(u); renderBulkList(&#x27;thResDie&#x27;, thDieList, &#x27;die&#x27;, &#x27;copySingleThDie&#x27;); }
}
function copySingleThLive(i){ copyText(thLiveList[i]||&#x27;&#x27;).then(()=>showToast(&#x27;Copied: &#x27;+thLiveList[i],&#x27;success&#x27;)).catch(()=>showToast(&#x27;Gagal copy&#x27;,&#x27;error&#x27;)); }
function copySingleThDie(i){ copyText(thDieList[i]||&#x27;&#x27;).then(()=>showToast(&#x27;Copied: &#x27;+thDieList[i],&#x27;success&#x27;)).catch(()=>showToast(&#x27;Gagal copy&#x27;,&#x27;error&#x27;)); }

function thNormalize(raw) {
  let s = String(raw).split(&#x27;|&#x27;)[0].trim();
  if (!s) return &#x27;&#x27;;
  const m = s.match(/(?:https?:\/\/)?(?:www\.)?threads\.(?:net|com)\/@?([^\/?#]+)/i);
  if (m) s = m[1];
  s = s.replace(/^@+/, &#x27;&#x27;);
  s = s.split(&#x27;?&#x27;)[0].split(&#x27;#&#x27;)[0].replace(/\/+$/, &#x27;&#x27;).trim();
  return s.toLowerCase();
}
function thIsValidUsername(username) {
  return /^[a-z0-9._]{1,30}$/i.test(username) &amp;&amp;
         !username.startsWith(&#x27;.&#x27;) &amp;&amp;
         !username.endsWith(&#x27;.&#x27;) &amp;&amp;
         !username.includes(&#x27;..&#x27;);
}
const TH_CHECK_TIMEOUT_MS = 12000;
async function thFetchText(url, timeoutMs = TH_CHECK_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: &#x27;no-store&#x27;, headers: { &#x27;Accept&#x27;: &#x27;text/plain,*/*&#x27; } });
    const text = await res.text();
    return { ok: res.ok, status: res.status, text };
  } catch (e) { return { ok: false, status: 0, text: &#x27;&#x27; }; }
  finally { clearTimeout(timer); }
}
async function thFetchTextRetry(url, attempts = 6) {
  let last = { ok:false, status:0, text:&#x27;&#x27; };
  for (let i = 0; i &lt; attempts; i++) {
    const r = await thFetchText(url);
    last = r;
    const failed = !r.ok || !r.text || r.status === 429 || r.status &gt;= 500 || r.status === 0;
    if (!failed) return r;
    await __sleep(600 * Math.pow(2, Math.min(i,5)) + Math.floor(Math.random()*500));
  }
  return last;
}
function thAnalyzeText(username, text) {
  if (!text) return &#x27;unknown&#x27;;
  const u = username.toLowerCase();
  const body = text.toLowerCase();
  // Sinyal DIE eksplisit (halaman error / login wall tanpa profil)
  const dieSignals = [
    &quot;sorry, this page isn&#x27;t available&quot;,
    &#x27;sorry, this page isn’t available&#x27;,
    &#x27;page not found&#x27;,
    &#x27;target url returned error 404&#x27;,
    &#x27;warning: target url returned error 404&#x27;,
    &#x27;the link you followed may be broken&#x27;,
    &#x27;content unavailable&#x27;,
    &#x27;user not found&#x27;
  ];
  if (dieSignals.some((sig) => body.includes(sig))) return &#x27;die&#x27;;
  // Halaman Threads untuk akun mati/tidak ada = &quot;Threads • Log in&quot; / &quot;Threads · Log in&quot;
  // dan tidak menyebut username sama sekali.
  const isLoginOnly = /title:\s*threads\s*[•·].{0,10}log in/i.test(text) || /^threads\s*[•·]\s*log in/i.test(text.trim());
  if (isLoginOnly &amp;&amp; !body.includes(u)) return &#x27;die&#x27;;
  // Sinyal LIVE kuat: username muncul di body dan ada indikasi profil
  // Sinyal LIVE hanya dari konten profil unik (bukan echo URL di halaman login-wall).
  const liveSignals = [
    &#x27;(@&#x27; + u + &#x27;)&#x27;,
    &#x27;log in to see more from &#x27; + u,
    u + &#x27;&#x27; + &#x27;s profile picture&#x27;,
    u + &#x27;’s profile picture&#x27;,
    &#x27;see more of &#x27; + u
  ];
  if (liveSignals.some((sig) => body.includes(sig))) return &#x27;live&#x27;;
  // Semua sisanya =&gt; die (termasuk halaman &quot;Threads • Log in&quot; tanpa profil).
  return &#x27;die&#x27;;
}
async function thCheckUser(username) {
  if (!username || !thIsValidUsername(username)) return false;
  const u = encodeURIComponent(username);
  const cb = Date.now() + &#x27;-&#x27; + Math.random().toString(36).slice(2);
  const sources = [
    `https://r.jina.ai/http://https://www.threads.net/@${u}?__th_checker=${cb}`,
    `https://r.jina.ai/http://https://www.threads.com/@${u}?__th_checker=${cb}`
  ];
  let sawEmpty = false;
  for (const url of sources) {
    const result = await thFetchTextRetry(url);
    if (!result.text) { sawEmpty = true; continue; }
    const verdict = thAnalyzeText(username, result.text);
    if (verdict === &#x27;live&#x27;) return true;
    if (verdict === &#x27;die&#x27;) return false;
  }
  // Kalau semua source gagal fetch (rate-limit) — kembalikan &#x27;unknown&#x27; untuk di-retry.
  if (sawEmpty) return &#x27;unknown&#x27;;
  return false;
}
function thSetBtnLoading(loading) {
  const btn = document.getElementById(&#x27;thBtnStart&#x27;);
  btn.classList.toggle(&#x27;loading&#x27;, loading);
  btn.disabled = loading;
  btn.lastChild &amp;&amp; (btn.lastChild.textContent = loading ? &#x27; Mengecek...&#x27; : &#x27; Mulai Check&#x27;);
}
async function thStartCheck() {
  if (thChecking) { thStopFlag = true; showToast(&#x27;Stopping...&#x27;, &#x27;warning&#x27;); return; }
  const raw = document.getElementById(&#x27;thInputList&#x27;).value.trim();
  if (!raw) { showToast(&#x27;Isi dulu list username Threads&#x27;, &#x27;error&#x27;); return; }
  const users = [...new Set(raw.split(/[\s,;\n\r]+/).map(thNormalize).filter(Boolean))];
  if (!users.length) { showToast(&#x27;Tidak ada username valid&#x27;, &#x27;error&#x27;); return; }
  thLiveList = []; thDieList = [];
  thCounter = { total: users.length, live: 0, die: 0, checked: 0 };
  clearBulkList(&#x27;thResLive&#x27;, &#x27;Username Live akan muncul di sini...&#x27;);
  clearBulkList(&#x27;thResDie&#x27;, &#x27;Username Die akan muncul di sini...&#x27;);
  thUpdateStats();
  thChecking = true; thStopFlag = false;
  thSetBtnLoading(true);
  showToast(&#x27;Mulai cek &#x27; + users.length + &#x27; username Threads&#x27;, &#x27;info&#x27;);
  const TH_CONCURRENCY = 4;
  let thIdx = 0;
  async function thWorker() {
    while (!thStopFlag) {
      const i = thIdx++;
      if (i >= users.length) break;
      const u = users[i];
      let ok = &#x27;unknown&#x27;;
      for (let pass = 0; pass &lt; 6 &amp;&amp; !thStopFlag; pass++) {
        ok = await thCheckUser(u);
        if (ok === true || ok === false) break;
        await __sleep(900 + pass * 800 + Math.floor(Math.random()*600));
      }
      if (thStopFlag) break;
      if (ok === true) { thCounter.live++; thAppendResult(u, true); }
      else { thCounter.die++; thAppendResult(u, false); }
      thCounter.checked++; thUpdateStats();
    }
  }
  await Promise.all(Array.from({length: Math.min(TH_CONCURRENCY, users.length)}, thWorker));
  thChecking = false;
  thSetBtnLoading(false);
  showToast(thStopFlag ? &#x27;Dihentikan&#x27; : &#x27;Selesai! Live: &#x27; + thCounter.live + &#x27; | Die: &#x27; + thCounter.die,
            thStopFlag ? &#x27;warning&#x27; : &#x27;success&#x27;);
  if (!thStopFlag) showFinishModal(&#x27;Threads Checker&#x27;, thCounter, thLiveList, thDieList, &#x27;threads&#x27;);
}
function thResetAll() {
  if (thChecking) { thStopFlag = true; }
  thLiveList = []; thDieList = [];
  thCounter = { total: 0, live: 0, die: 0, checked: 0 };
  document.getElementById(&#x27;thInputList&#x27;).value = &#x27;&#x27;;
  clearBulkList(&#x27;thResLive&#x27;, &#x27;Username Live akan muncul di sini...&#x27;);
  clearBulkList(&#x27;thResDie&#x27;, &#x27;Username Die akan muncul di sini...&#x27;);
  thUpdateStats();
  showToast(&#x27;Semua di-reset&#x27;, &#x27;info&#x27;);
}
function thClearResult(kind) {
  if (kind === &#x27;live&#x27;) { thLiveList = []; thCounter.live = 0; document.getElementById(&#x27;thBadgeLive&#x27;).textContent = &#x27;0 item&#x27;; document.getElementById(&#x27;th-s-live&#x27;).textContent = 0; clearBulkList(&#x27;thResLive&#x27;,&#x27;Username Live akan muncul di sini...&#x27;); }
  else { thDieList = []; thCounter.die = 0; document.getElementById(&#x27;thBadgeDie&#x27;).textContent = &#x27;0 item&#x27;; document.getElementById(&#x27;th-s-die&#x27;).textContent = 0; clearBulkList(&#x27;thResDie&#x27;,&#x27;Username Die akan muncul di sini...&#x27;); }
  showToast(&#x27;List &#x27; + kind.toUpperCase() + &#x27; dikosongkan&#x27;, &#x27;info&#x27;);
}
function thCopyResult(kind) {
